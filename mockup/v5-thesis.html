  html+='<div class="box"><h4>The case <span id="sv" style="color:var(--fa);text-transform:none;letter-spacing:0;font-weight:500"></span></h4><div class="thesis" id="th" contenteditable="true" spellcheck="false" data-ph="No thesis yet. In one or two sentences: why do you own this, and what would change your mind?">'+h.thesis+'</div></div>'

   +'<div class="box"><h4>Position discipline</h4><div class="kv"><span>Weight</span><span class="mo">'+h.w+'%</span></div><div class="kv"><span>Size cap</span><span class="mo">'+h.maxw+'%</span></div><div class="gauge"><i style="width:'+bwPct+'%;background:'+(h.w>h.maxw?'var(--rd)':'var(--sage)')+'"></i><u style="left:'+capPct+'%"></u></div><div class="kv"><span>Value</span><span class="mo">$'+fmt(h.v)+'</span></div><div class="kv"><span>Return</span><span class="mo '+(h.r>=0?'gn':'rd')+'">'+pc(h.r)+'</span></div><div class="kv"><span>Last / next review</span><span class="mo">'+(h.last==null?'—':h.last<0?'never':h.last+'d ago')+' / '+(h.due==null?'—':h.due<0?(-h.due)+'d late':'in '+h.due+'d')+'</span></div></div></div>'
   +'<div class="box" style="margin-top:1rem"><h4>Price and your notes <span style="text-transform:none;letter-spacing:0;font-weight:500">gold dots are notes — click one</span></h4><div class="chw" id="ch"></div></div>'

function drawChart(h){var W=760,Ht=210,pl=8,pr=50,pt=16,pb=22,d=priceSeries(h),n=d.length,days=180;var mn=Math.min.apply(null,d),mx=Math.max.apply(null,d),pd=(mx-mn)*.12;mn-=pd;mx+=pd;

  for(i=0;i<=3;i++){var v=mn+(mx-mn)*i/3,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#1E2D23"/><text x="'+(W-pr+6)+'" y="'+(y+4)+'" font-family="JetBrains Mono" font-size="10" fill="#5D7565">'+(v>999?fmt(v):v.toFixed(0))+'</text>';}

  var cost=(costY>pt&&costY<Ht-pb)?'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+costY+'" y2="'+costY+'" stroke="#D9BE72" stroke-dasharray="4 4" stroke-width="1"/><text x="'+(pl+2)+'" y="'+(costY-4)+'" font-size="9" fill="#B99B4E">average cost</text>':'';
  var mk='';h.notes.forEach(function(nt,i){if(nt.ago>days)return;var ix=Math.round((1-nt.ago/days)*(n-1)),x=X(ix),y=Y(d[ix]);mk+='<g class="mk" data-i="'+i+'"><line x1="'+x+'" x2="'+x+'" y1="'+y+'" y2="'+(Ht-pb)+'" stroke="#D9BE72" stroke-opacity=".25"/><circle cx="'+x+'" cy="'+y+'" r="7" fill="#0B120E" stroke="#D9BE72" stroke-width="2"/><circle cx="'+x+'" cy="'+y+'" r="2.5" fill="#D9BE72"/></g>';});
  $('#ch').innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DB59A" stop-opacity=".28"/><stop offset="1" stop-color="#8DB59A" stop-opacity="0"/></linearGradient></defs>'+g+'<polygon points="'+X(0)+','+(Ht-pb)+' '+p+' '+X(n-1)+','+(Ht-pb)+'" fill="url(#cg)"/><polyline points="'+p+'" fill="none" stroke="#8DB59A" stroke-width="2" stroke-linejoin="round"/>'+cost+mk+'</svg>';
  $$('#ch .mk').forEach(function(m){m.addEventListener('click',function(){hlNote=+m.dataset.i;drawTimeline(h);var el=$('.te.hl');el&&el.scrollIntoView({behavior:'smooth',block:'center'});});m.addEventListener('mouseenter',function(e){var nt=h.notes[+m.dataset.i],t=$('#tip');t.innerHTML='<b style="color:var(--gold)">'+nt.type+' · '+dstr(nt.ago)+'</b><br>'+nt.text.slice(0,70)+(nt.text.length>70?'…':'');t.style.display='block';var r=m.getBoundingClientRect();t.style.left=Math.min(window.innerWidth-260,r.left)+'px';t.style.top=(r.top-64)+'px';});m.addEventListener('mouseleave',function(){$('#tip').style.display='none';});});}

  $('#ct').innerHTML='<div class="pg"><h1>Is the book well made?</h1><p class="lede">Not how it performed — how it was <em>built</em>. Six rules, checked live against your book. Edit a conviction or write a thesis and watch the score move.</p>'

   +'<div class="box" style="margin-top:1rem"><h4>The rules of the book</h4>'+rules.map(function(r){return '<div class="rule"><span class="st p '+(r.ok?'ok':'due')+'">'+(r.ok?'PASS':'FAIL')+'</span><div><b>'+r.t+'</b><div class="mu" style="font-size:.82rem">'+r.d+'</div></div></div>';}).join('')+'</div></div>';

// ---------- watch ----------
function renderWatch(){$('#ct').innerHTML='<div class="pg"><h1>Watching</h1><p class="lede">Ideas that have earned a place on the list but not yet a place in the book. Each has a price at which you said you would act.</p><div class="wc">'
   +(WATCH.map(function(w){var gap=(w.px/w.trig-1)*100,prog=Math.max(6,Math.min(100,100-gap*4));return '<div class="wcard"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="t">'+w.t+'</div><div class="mu" style="font-size:.8rem">'+w.n+'</div></div><div style="text-align:right"><div class="mo">$'+fmt(w.px)+'</div><div class="mu" style="font-size:.72rem">trigger $'+fmt(w.trig)+'</div></div></div><p style="margin:.9rem 0 .3rem;font-size:.9rem">'+w.why+'</p><p class="mu" style="margin:0;font-size:.82rem">'+w.pos+'</p><div class="prog"><i style="width:'+prog+'%"></i></div><div style="display:flex;justify-content:space-between;font-size:.76rem" class="mu"><span>'+gap.toFixed(1)+'% above trigger</span><span>'+(gap<5?'Close':'Waiting')+'</span></div><div style="display:flex;gap:.5rem;margin-top:1rem"><button class="btn pri" data-p="'+w.t+'">Promote to the book</button><button class="btn" data-d="'+w.t+'">Drop</button></div></div>';}).join('')||'<div class="mu">Nothing on the list.</div>')+'</div></div>';
  $$('#ct [data-p]').forEach(function(b){b.addEventListener('click',function(){var w=WATCH.filter(function(x){return x.t===b.dataset.p;})[0];WATCH.splice(WATCH.indexOf(w),1);var nh=T(w.t,w.n,'US equity',0,0,0,w.px,1,90,0,'Starter position: '+w.why,[],[{ago:0,type:'Buy',text:'Promoted from the watchlist at $'+w.px+'. '+w.pos}],5);nh.v=0;nh.cost=1;H.splice(1,0,nh);sel=w.t;tab='case';render();toast(w.t+' is in the book — write the thesis while it is fresh');});});
  $$('#ct [data-d]').forEach(function(b){b.addEventListener('click',function(){var w=WATCH.filter(function(x){return x.t===b.dataset.d;})[0];WATCH.splice(WATCH.indexOf(w),1);renderWatch();toast('Dropped '+w.t);});});}
// ---------- router ----------
function render(){renderTabs();var m=$('#main');if(tab==='case'){m.classList.remove('wide');$('#lf').style.display='';$('#rt').style.display='';renderList();renderCase();renderDesk();}
  else{m.classList.add('wide');$('#lf').style.display='none';$('#rt').style.display='none';({queue:renderQueue,quality:renderQuality,results:renderResults,watch:renderWatch})[tab]();}
  $('#ct').scrollTop=0;}
render();
</script>
