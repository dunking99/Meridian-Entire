function chart(host,cfg){

  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),pd=(mx-mn)*.08||1;mn-=pd;mx+=pd;var n=cfg.series[0].data.length;
  var X=function(i){return pl+i*(W-pl-pr)/(n-1);},Y=function(v){return pt+(mx-v)/(mx-mn)*(Ht-pt-pb);};
  var g='',i;for(i=0;i<=4;i++){var v=mn+(mx-mn)*i/4,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#1E2732"/><text x="'+(W-pr+6)+'" y="'+(y+4)+'" font-family="IBM Plex Mono" font-size="10" fill="#556274">'+cfg.fy(v)+'</text>';}
  [0,.25,.5,.75,1].forEach(function(f){g+='<text x="'+X(Math.round(f*(n-1)))+'" y="'+(Ht-5)+'" font-size="10" fill="#556274" font-family="IBM Plex Mono" text-anchor="'+(f===0?'start':f===1?'end':'middle')+'">'+(cfg.days<=1?(9+Math.round(f*7))+':30':dstr(Math.round((1-f)*cfg.days)))+'</text>';});
  var L='',defs='<defs>';cfg.series.forEach(function(s,k){var p=s.data.map(function(v,j){return X(j).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
    if(s.area){defs+='<linearGradient id="g'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+s.color+'" stop-opacity=".32"/><stop offset="1" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>';L+='<polygon points="'+X(0)+','+(Ht-pb)+' '+p+' '+X(n-1)+','+(Ht-pb)+'" fill="url(#g'+k+')"/>';}
    L+='<polyline points="'+p+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||1.8)+'" '+(s.dash?'stroke-dasharray="'+s.dash+'"':'')+' stroke-linejoin="round"/>';});
  defs+='</defs>';
  host.innerHTML='<div class="chartw"><svg viewBox="0 0 '+W+' '+Ht+'">'+defs+g+L+'<line class="xh" y1="'+pt+'" y2="'+(Ht-pb)+'" stroke="#8FA8FF" stroke-dasharray="3 3" style="display:none"/><circle class="xd" r="4" fill="#8FA8FF" stroke="#090C11" stroke-width="2" style="display:none"/></svg><div class="cx"></div></div>';
  var svg=$('svg',host),xh=$('.xh',host),xd=$('.xd',host),cx=$('.cx',host);
  svg.addEventListener('mousemove',function(e){var r=svg.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width*W,ix=Math.max(0,Math.min(n-1,Math.round((fx-pl)/((W-pl-pr)/(n-1)))));var x=X(ix);
    xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.style.display='';xd.setAttribute('cx',x);xd.setAttribute('cy',Y(cfg.series[0].data[ix]));xd.style.display='';
    cx.style.display='block';var px=x/W*r.width;cx.style.left=Math.min(px+12,r.width-170)+'px';cx.style.top=(Y(cfg.series[0].data[ix])/Ht*r.height-40)+'px';
    var lab=cfg.days<=1?(9+Math.round(ix/(n-1)*7))+':'+(ix%2?'30':'00'):dstr(Math.round((1-ix/(n-1))*cfg.days));
    cx.innerHTML='<span class="mu">'+lab+'</span>  <b>'+cfg.fy(cfg.series[0].data[ix],1)+'</b>'+(cfg.series[1]?'  <span class="mu">idx '+cfg.fy(cfg.series[1].data[ix],1)+'</span>':'');});
  svg.addEventListener('mouseleave',function(){xh.style.display='none';xd.style.display='none';cx.style.display='none';});
}

  return '<div style="display:flex;gap:1.2rem;align-items:center"><svg width="140" height="140" viewBox="0 0 140 140">'+s+'<text x="70" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#DCE4EE" id="dc1">$285k</text><text x="70" y="83" text-anchor="middle" font-size="10" fill="#556274" id="dc2">NET VALUE</text></svg><div style="flex:1">'+Object.keys(agg).map(function(k){return '<div class="kvr lg" data-k="'+k+'" style="cursor:pointer"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+CLASSC[k]+';margin-right:.5rem"></i>'+k+'</span><span class="mo">'+agg[k].toFixed(1)+'%</span></div>';}).join('')+'</div></div>';}

var COLDEF=[['px','Price'],['qty','Qty'],['w','Weight'],['v','Value'],['sp','30d'],['d','Day'],['r','Return'],['y','Yield'],['cost','Cost']];

  function rows(){var l=H.filter(function(h){return (posF==='All'||h.c===posF)&&(!posQ||(h.t+h.n).toLowerCase().indexOf(posQ.toLowerCase())>-1);});l.sort(function(a,b){var x=a[posS],y=b[posS];return (x>y?1:x<y?-1:0)*posD;});

    var tb='<tbody>'+l.map(function(h){return '<tr class="rw'+(sel[h.t]?' sel':'')+'" data-t="'+h.t+'"><td><input type="checkbox" class="ck" '+(sel[h.t]?'checked':'')+'></td><td><b>'+h.t+'</b> <span class="mu">'+h.n+'</span></td><td><span style="color:'+CLASSC[h.c]+'">●</span> '+h.c+'</td>'
     +(cols.px?'<td class="r mo">'+(h.px>999?fmt(h.px):h.px.toFixed(2))+'</td>':'')+(cols.qty?'<td class="r mo">'+(h.t==='CASH'?'—':h.qty.toFixed(h.qty<5?2:0))+'</td>':'')+(cols.w?'<td class="r mo">'+h.w.toFixed(1)+'%</td>':'')+(cols.v?'<td class="r mo">$'+fmt(h.v)+'</td>':'')+(cols.sp?'<td class="r">'+spark(h.sp,60,18,h.m>=0?'#34C38F':'#F0616D')+'</td>':'')+(cols.d?'<td class="r mo '+cl(h.d)+'">'+pc(h.d)+'</td>':'')+(cols.r?'<td class="r mo '+cl(h.r)+'">'+pc(h.r,1)+'</td>':'')+(cols.y?'<td class="r mo">'+h.y.toFixed(1)+'%</td>':'')+(cols.cost?'<td class="r mo">$'+fmt(h.cost)+'</td>':'')+'</tr>';}).join('')+'</tbody>';

}

// ---------- SCENARIO LAB ----------
var SC={us:-20,intl:-18,rate:100,btc:-40,gold:5};
var PRE=[['2008 crash',{us:-37,intl:-43,rate:-150,btc:0,gold:5}],['COVID Mar-20',{us:-34,intl:-32,rate:-100,btc:-50,gold:-3}],['2022 rates',{us:-19,intl:-16,rate:250,btc:-64,gold:0}],['Crypto winter',{us:-5,intl:-4,rate:0,btc:-75,gold:2}],['Melt-up',{us:25,intl:15,rate:-25,btc:60,gold:-4}],['Reset',{us:0,intl:0,rate:0,btc:0,gold:0}]];
function renderLab(){
  var defs=[['us','US equities','%',-50,40],['intl','Intl equities','%',-50,40],['rate','Rates change','bp',-300,300],['btc','Bitcoin','%',-80,100],['gold','Gold','%',-30,40]];
  $('#v-lab').innerHTML='<div class="grid">'+panel('sl','Shock the portfolio',5,defs.map(function(d){return '<div class="sl"><span>'+d[1]+'</span><input type="range" min="'+d[3]+'" max="'+d[4]+'" value="'+SC[d[0]]+'" data-k="'+d[0]+'"><span class="mo" style="text-align:right" id="lv-'+d[0]+'">'+SC[d[0]]+d[2]+'</span></div>';}).join('')+'<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem">'+PRE.map(function(p,i){return '<button class="chip" data-pre="'+i+'">'+p[0]+'</button>';}).join('')+'</div>')
   +panel('rs','Result',7,'<div style="display:flex;gap:2.2rem;align-items:flex-end;margin-bottom:.9rem"><div><div class="mu" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase">Estimated impact</div><div class="mo" style="font-size:38px;line-height:1.1" id="ri"></div></div><div><div class="mu" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase">Portfolio after</div><div class="mo" style="font-size:22px" id="rp"></div></div></div><div id="rb"></div>')+'</div>';
  function calc(){var imp=[],tot=0;H.forEach(function(h){var s=0;if(h.c==='US equity')s=SC.us/100;else if(h.c==='Intl equity')s=SC.intl/100;else if(h.c==='Fixed income')s=-6.2*SC.rate/10000;else if(h.t==='BTC')s=SC.btc/100;else if(h.t==='GLD')s=SC.gold/100;var v=h.v*s;tot+=v;if(v!==0)imp.push({t:h.t,v:v});});
    imp.sort(function(a,b){return a.v-b.v;});$('#ri').innerHTML='<span class="'+cl(tot)+'">'+(tot>=0?'+':'−')+'$'+fmt(Math.abs(tot))+'</span> <span class="mu" style="font-size:18px">'+pc(tot/TOTAL*100,1)+'</span>';$('#rp').textContent='$'+fmt(TOTAL+tot);
    var mx=Math.max.apply(null,imp.map(function(x){return Math.abs(x.v);}))||1;
    $('#rb').innerHTML=imp.map(function(x){var w=Math.abs(x.v)/mx*50;return '<div class="bar2" style="grid-template-columns:52px 1fr 80px"><span><b>'+x.t+'</b></span><div class="t" style="height:12px"><i style="position:absolute;'+(x.v<0?'right:50%':'left:50%')+';width:'+w+'%;background:'+(x.v<0?'#F0616D':'#34C38F')+'"></i><span style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#2B3745"></span></div><span class="mo" style="text-align:right">'+(x.v>=0?'+':'−')+'$'+fmt(Math.abs(x.v))+'</span></div>';}).join('');}
  $$('#v-lab input[type=range]').forEach(function(r){r.addEventListener('input',function(){SC[r.dataset.k]=+r.value;$('#lv-'+r.dataset.k).textContent=r.value+(r.dataset.k==='rate'?'bp':'%');calc();});});
  $$('#v-lab [data-pre]').forEach(function(b){b.addEventListener('click',function(){var p=PRE[+b.dataset.pre];SC=JSON.parse(JSON.stringify(p[1]));renderLab();toast('Loaded '+p[0]);});});calc();}

// ---------- FLOWS ----------
var txT='All';
var TX=[['Sep 18','Buy','NVDA','10 sh @ $115.20',-1152],['Sep 14','Div','MSFT','$0.83 × 45',37],['Sep 10','Sell','BND','50 sh @ $72.10',3605],['Sep 03','Deposit','—','Bank transfer',2000],['Aug 29','Buy','BTC','0.05 @ $63,800',-3190],['Aug 22','Div','VTI','$0.94 × 200',188],['Aug 15','Buy','VXUS','80 sh @ $60.80',-4864],['Aug 03','Deposit','—','Bank transfer',2000],['Jul 22','Div','JPM','$1.25 × 60',75],['Jul 09','Sell','XOM','20 sh @ $111.00',2220]];
function renderFlows(){
  var mo=['Apr','May','Jun','Jul','Aug','Sep'],dep=[2000,2000,2000,2000,2000,2000],div=[420,180,610,195,210,278],trd=[-1800,-2400,-900,2220,-8054,2413];
  var mx=3000,bars='';mo.forEach(function(m,i){var x=30+i*80;bars+='<rect x="'+x+'" y="'+(160-dep[i]/mx*120)+'" width="26" height="'+(dep[i]/mx*120)+'" fill="#8FA8FF"/><rect x="'+(x+28)+'" y="'+(160-div[i]/mx*120)+'" width="26" height="'+(div[i]/mx*120)+'" fill="#34C38F"/><text x="'+(x+27)+'" y="178" text-anchor="middle" font-size="11" fill="#556274">'+m+'</text>';});
  $('#v-flows').innerHTML='<div class="grid">'+panel('fl','Contributions & dividends, 6 months',5,'<svg viewBox="0 0 500 190" style="width:100%">'+bars+'</svg><div style="display:flex;gap:1rem;font-size:12px" class="mu"><span><i style="display:inline-block;width:8px;height:8px;background:#8FA8FF;margin-right:5px"></i>Deposits</span><span><i style="display:inline-block;width:8px;height:8px;background:#34C38F;margin-right:5px"></i>Dividends</span></div><div class="kvr" style="margin-top:.8rem"><span>Contributed, 6m</span><span class="mo">$12,000</span></div><div class="kvr"><span>Dividends, 6m</span><span class="mo gn">+$1,893</span></div>')
   +panel('tx','Transactions',7,'<div class="tb">'+['All','Buy','Sell','Div','Deposit'].map(function(t){return '<button class="chip '+(t===txT?'on':'')+'" data-t="'+t+'">'+t+'</button>';}).join('')+'</div><table>'+TX.filter(function(t){return txT==='All'||t[1]===txT;}).map(function(t){return '<tr><td class="mu">'+t[0]+'</td><td><span class="pill '+(t[1]==='Buy'?'b':t[1]==='Sell'?'a':'g')+'">'+t[1].toUpperCase()+'</span></td><td><b>'+t[2]+'</b></td><td class="mu">'+t[3]+'</td><td class="r mo '+(t[4]>0?'gn':'')+'">'+(t[4]>0?'+':'−')+'$'+fmt(Math.abs(t[4]))+'</td></tr>';}).join('')+'</table>')+'</div>';
  $$('#v-flows .chip[data-t]').forEach(function(c){c.addEventListener('click',function(){txT=c.dataset.t;renderFlows();});});}

// ---------- JOURNAL ----------
var JR=[['Sep 18','NVDA','Added 10 shares','Post-earnings dip felt overdone; kept position under 7%.','pending'],['Sep 10','BND','Trimmed 50 shares','Funding the international top-up. Fixed income stays above 12%.','good'],['Aug 29','BTC','Bought 0.05','Small DCA. Broke my 5% cap by 0.5 pts — accept for now.','flag'],['Jul 09','XOM','Sold 20 shares','Energy overweight vs plan. Took the gain.','good']];
function renderJournal(){
  $('#v-journal').innerHTML='<div class="grid">'+panel('jn','Decision log',8,'<div style="display:flex;gap:.6rem;margin-bottom:1rem"><input class="inp" id="jt" style="width:90px" placeholder="TICKER"><input class="inp" id="jx" style="flex:1;width:auto" placeholder="What did you do, and why?"><button class="chip on" id="ja">Log it ⏎</button></div><div class="tl" id="jl"></div>')
   +panel('js','Review stats',4,[['Decisions logged','27'],['Judged good','19 (70%)'],['Flagged','3'],['Avg hold before sell','14 months']].map(function(x){return '<div class="kvr"><span>'+x[0]+'</span><span class="mo">'+x[1]+'</span></div>';}).join('')+'<div class="mu" style="margin-top:.8rem;font-size:12px">Decisions you tag &ldquo;pending&rdquo; are revisited after 90 days.</div>')+'</div>';
  function draw(){$('#jl').innerHTML=JR.map(function(j){return '<div class="tle"><div class="mu mo" style="font-size:12px">'+j[0]+' · <b style="color:var(--tx)">'+j[1]+'</b> <span class="pill '+(j[4]==='good'?'g':j[4]==='flag'?'a':'b')+'">'+j[4].toUpperCase()+'</span></div><div><b>'+j[2]+'</b></div><div class="mu" style="font-size:13px">'+j[3]+'</div></div>';}).join('');}
  draw();function add(){var t=$('#jt').value.toUpperCase(),x=$('#jx').value;if(!x)return;JR.unshift(['Sep 20',t||'—','Note',x,'pending']);renderJournal();toast('Logged');}
  $('#ja').onclick=add;$('#jx').addEventListener('keydown',function(e){if(e.key==='Enter')add();});}

// ---------- tabs / router ----------
var TABS=[['overview','Overview',renderOverview],['positions','Positions',renderPositions],['risk','Risk',renderRisk],['lab','Scenario Lab',renderLab],['flows','Flows',renderFlows],['journal','Journal',renderJournal]];
function tab(id){var idx=0;TABS.forEach(function(t,i){if(t[0]===id)idx=i;});$$('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+id);});$$('#tabs button.tb').forEach(function(b){b.classList.toggle('on',b.dataset.id===id);});TABS[idx][2]();$('#insp').classList.remove('on');location.hash=id;$('#body').scrollTop=0;}
$('#tabs').innerHTML=TABS.map(function(t,i){return '<button class="tb'+(i===0?' on':'')+'" data-id="'+t[0]+'">'+t[1]+' <kbd>'+(i+1)+'</kbd></button>';}).join('')+'<button class="dens" id="dens">▤ Density</button>';
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='dens'){document.body.classList.toggle('compact');toast(document.body.classList.contains('compact')?'Compact rows':'Comfortable rows');return;}tab(b.dataset.id);});

// ---------- palette ----------
var cmds=[];TABS.forEach(function(t,i){cmds.push({l:'Go to '+t[1],k:'View',f:function(){tab(t[0]);}});});
H.forEach(function(h){cmds.push({l:h.t+' — '+h.n,k:'Position',f:function(){openInsp(h.t);}});});
PRE.forEach(function(p,i){cmds.push({l:'Scenario: '+p[0],k:'Lab',f:function(){SC=JSON.parse(JSON.stringify(p[1]));tab('lab');}});});
cmds.push({l:'Toggle compact density',k:'Action',f:function(){document.body.classList.toggle('compact');}});cmds.push({l:'Export positions as CSV',k:'Action',f:function(){toast('positions.csv downloaded (demo)');}});cmds.push({l:'Show keyboard shortcuts',k:'Help',f:function(){$('#ov2').classList.add('on');}});
var pi=0,pf=[];
function palRender(){var q=$('#pi').value.toLowerCase();pf=cmds.filter(function(c){return !q||c.l.toLowerCase().indexOf(q)>-1;}).slice(0,50);if(pi>=pf.length)pi=0;$('#pl').innerHTML=pf.map(function(c,i){return '<div class="it'+(i===pi?' on':'')+'" data-i="'+i+'">'+c.l+'<small>'+c.k+'</small></div>';}).join('')||'<div class="it mu">No matches</div>';
  $$('#pl .it[data-i]').forEach(function(el){el.addEventListener('click',function(){run(+el.dataset.i);});});}
function run(i){var c=pf[i];if(!c)return;$('#ov').classList.remove('on');c.f();}
function palOpen(){$('#ov').classList.add('on');$('#pi').value='';pi=0;palRender();setTimeout(function(){$('#pi').focus();},20);}
$('#cmdk').onclick=palOpen;$('#qm').onclick=function(){$('#ov2').classList.add('on');};
$('#pi').addEventListener('input',function(){pi=0;palRender();});
$('#pi').addEventListener('keydown',function(e){if(e.key==='ArrowDown'){pi=Math.min(pf.length-1,pi+1);palRender();e.preventDefault();}else if(e.key==='ArrowUp'){pi=Math.max(0,pi-1);palRender();e.preventDefault();}else if(e.key==='Enter'){run(pi);}});
$('#ov').addEventListener('mousedown',function(e){if(e.target.id==='ov')$('#ov').classList.remove('on');});$('#ov2').addEventListener('mousedown',function(e){if(e.target.id==='ov2')$('#ov2').classList.remove('on');});
$('#sc').innerHTML=[['Ctrl / ⌘ + K','Command palette'],['1 – 6','Switch tab'],['/','Filter positions'],['D','Toggle density'],['?','This help'],['Esc','Close anything']].map(function(s){return '<div class="kvr"><span class="mo" style="color:var(--ac)">'+s[0]+'</span><span>'+s[1]+'</span></div>';}).join('');
document.addEventListener('keydown',function(e){var typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();return;}
  if(e.key==='Escape'){$('#ov').classList.remove('on');$('#ov2').classList.remove('on');$('#insp').classList.remove('on');$('#max').classList.remove('on');document.activeElement.blur&&document.activeElement.blur();return;}
  if(typing)return;
  if(e.key>='1'&&e.key<='6'){tab(TABS[+e.key-1][0]);}else if(e.key==='/'){e.preventDefault();tab('positions');setTimeout(function(){$('#pq').focus();},30);}else if(e.key==='?'){$('#ov2').classList.add('on');}else if(e.key.toLowerCase()==='d'){document.body.classList.toggle('compact');}});
var start=(location.hash||'#overview').slice(1);tab(TABS.some(function(t){return t[0]===start;})?start:'overview');
</script>
