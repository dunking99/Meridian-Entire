/* ===================== KIT (shared toolkit) ===================== */
var KIT = (function(){
/* Meridian Markets — shared client toolkit: hash router, charts, tooltips */

function rnd(seed) {
  let s = (seed * 9301 + 49297) % 233280;
  return function () {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function series(n, seed, vol, drift = 0, start = 100) {
  const r = rnd(seed);
  const out = [];
  let v = start;
  for (let i = 0; i < n; i++) {
    v = v * (1 + (r() - 0.5) * vol + drift);
    out.push(v);
  }
  return out;
}

function path(a, w, h, pad = 0) {
  const mn = Math.min(...a), mx = Math.max(...a), rg = mx - mn || 1;
  return a
    .map((v, i) => (i ? "L" : "M") + ((i / (a.length - 1)) * w).toFixed(2) + " " + (pad + (h - 2 * pad) - ((v - mn) / rg) * (h - 2 * pad)).toFixed(2))
    .join(" ");
}
function area(a, w, h, pad = 0) {
  return path(a, w, h, pad) + ` L${w} ${h} L0 ${h} Z`;
}

let uid = 0;
function spark(a, w, h, col, fill, sw) {
  const id = "g" + ++uid;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    ${fill ? `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".38"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area(a, w, h, 2)}" fill="url(#${id})"/>` : ""}
    <path d="${path(a, w, h, 2)}" fill="none" stroke="${col}" stroke-width="${sw || 1.6}" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* main line chart with optional grid lines */
function chart(opts) {
  const { vals, w = 880, h = 240, color = "#29d08b", fill = true, grid = [], pad = 14, sw = 2, labels = [] } = opts;
  const id = "g" + ++uid;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const Y = (v) => pad + (h - 2 * pad) - ((v - mn) / rg) * (h - 2 * pad);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    ${fill ? `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>` : ""}
    ${grid.map((g) => `<line x1="0" x2="${w}" y1="${Y(g)}" y2="${Y(g)}" stroke="currentColor" stroke-opacity=".13"/>`).join("")}
    <path d="${area(vals, w, h, pad)}" fill="url(#${id})" opacity="${fill ? 1 : 0}"/>
    <path d="${path(vals, w, h, pad)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>
    <circle cx="${w}" cy="${Y(vals[vals.length - 1])}" r="3.5" fill="${color}"/>
    ${labels.map((l, i) => `<text x="${(i / (labels.length - 1)) * (w - 20) + 10}" y="${h - 2}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".5" font-family="IBM Plex Mono">${l}</text>`).join("")}
  </svg>`;
}

function sign(v, d = 2) {
  return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
}
const dir = (v) => (v > 0 ? "up" : v < 0 ? "dn" : "fl");

/* ---------- tooltip ---------- */
let tipEl;
function ensureTip() {
  if (tipEl) return tipEl;
  tipEl = document.createElement("div");
  tipEl.id = "mk-tip";
  tipEl.style.cssText =
    "position:fixed;z-index:999;pointer-events:none;opacity:0;transition:opacity .12s;background:#04060a;border:1px solid rgba(140,150,170,.4);color:#e8ecf4;padding:7px 10px;font:500 11.5px/1.45 'IBM Plex Mono',monospace;border-radius:6px;white-space:pre;box-shadow:0 14px 34px rgba(0,0,0,.45)";
  document.body.appendChild(tipEl);
  return tipEl;
}
function showTip(e, txt) {
  const t = ensureTip();
  t.textContent = txt;
  t.style.opacity = "1";
  const x = Math.min(e.clientX + 16, window.innerWidth - t.offsetWidth - 12);
  t.style.left = x + "px";
  t.style.top = Math.max(8, e.clientY - 14) + "px";
}
function hideTip() {
  if (tipEl) tipEl.style.opacity = "0";
}
function bindTips() {
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest("[data-tip]");
    if (t) showTip(e, t.getAttribute("data-tip"));
    else hideTip();
  });
  document.addEventListener("mouseleave", hideTip);
}

/* ---------- live clock ---------- */
function tickClocks() {
  const now = new Date();
  document.querySelectorAll("[data-clock]").forEach((el) => {
    const tz = el.getAttribute("data-clock");
    try {
      el.textContent = new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: tz === "local" ? undefined : tz,
      }).format(now) + (tz === "local" ? "" : " " + tz);
    } catch (err) {
      el.textContent = now.toLocaleTimeString();
    }
  });
}

/* ---------- segmented control wiring ----------
   markup: [data-seg-group="NAME"] > [data-seg="key"]; targets: [data-seg-target="NAME"][data-seg-view="key"] */
function wireSeg(scope, onPick) {
  scope.querySelectorAll("[data-seg-group]").forEach((g) => {
    const name = g.getAttribute("data-seg-group");
    g.querySelectorAll("[data-seg]").forEach((b) => {
      b.addEventListener("click", () => {
        g.querySelectorAll("[data-seg]").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        const key = b.getAttribute("data-seg");
        scope.querySelectorAll(`[data-seg-target="${name}"]`).forEach((t) => {
          t.style.display = t.getAttribute("data-seg-view") === key ? "" : "none";
        });
        if (onPick) onPick(name, key, b);
      });
    });
  });
}

/* ---------- hash router ---------- */
function boot(designs) {
  const root = document.getElementById("app");
  bindTips();
  tickClocks();
  setInterval(tickClocks, 1000);

  function parse() {
    const raw = (location.hash || "").replace(/^#\/?/, "");
    const parts = raw.split("/").filter(Boolean);
    const dKey = designs[parts[0]] ? parts[0] : Object.keys(designs)[0];
    const design = designs[dKey];
    const pKey = design.views[parts[1]] ? parts[1] : Object.keys(design.views)[0];
    return { design, dKey, page: design.views[pKey], pKey };
  }

  function render() {
    const { design, dKey, page, pKey } = parse();
    document.title = `${page.title} — ${design.name} · Meridian`;
    root.innerHTML = design.shell(page, { dKey, pKey, design });
    // switcher
    const old = document.getElementById("design-switcher");
    if (old) old.remove();
    const sw = document.createElement("div");
    sw.id = "design-switcher";
    sw.innerHTML =
      `<span>DESIGN</span>` +
      Object.keys(designs)
        .map((k, i) => {
          const d = designs[k];
          return `<a href="#/${k}/${d.views[pKey] ? pKey : Object.keys(d.views)[0]}" class="${k === dKey ? "on" : ""}">${"ABC"[i]} · ${d.short}</a>`;
        })
        .join("");
    document.body.appendChild(sw);
    const st = document.createElement("style");
    st.textContent = SWCSS;
    if (!document.getElementById("sw-style")) {
      st.id = "sw-style";
      document.body.appendChild(st);
    }
    if (page.init) page.init(root);
    wireSeg(root);
    window.scrollTo({ top: 0 });
  }

  window.addEventListener("hashchange", render);
  render();
}

const SWCSS = `
#design-switcher{position:fixed;right:18px;bottom:18px;z-index:900;display:flex;align-items:center;gap:6px;
  background:rgba(8,10,14,.86);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:999px;
  padding:7px 10px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#design-switcher span{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#8b93a3;padding:0 6px}
#design-switcher a{font:600 11px/1 'Inter',sans-serif;color:#cfd6e2;text-decoration:none;padding:7px 11px;border-radius:999px;transition:.15s}
#design-switcher a:hover{background:rgba(255,255,255,.1);color:#fff}
#design-switcher a.on{background:#fff;color:#0a0c10}
@media (max-width:760px){#design-switcher{left:12px;right:12px;justify-content:center;flex-wrap:wrap}}
`;

return {rnd:rnd, series:series, path:path, area:area, spark:spark, chart:chart, sign:sign, dir:dir, bindTips:bindTips, wireSeg:wireSeg, boot:boot};
})();

const CX = TENORS.map((_, i) => i / 9);

function curveSVG(key, color = "#ffb020") {
  const v = CURVES[key];
  const W = 760, H = 230;
  const X = (i) => 34 + CX[i] * (W - 74);
  const Y = (y) => H - 26 - (y / 6) * (H - 52);
  const line = v.map((y, i) => (i ? "L" : "M") + X(i) + " " + Y(y)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;color:#6d7783">
    ${[0, 1, 2, 3, 4, 5, 6].map((g) => `<line x1="34" x2="${W - 40}" y1="${Y(g)}" y2="${Y(g)}" stroke="currentColor" stroke-opacity=".14"/><text x="4" y="${Y(g) + 3.5}" font-size="9.5" font-family="IBM Plex Mono" fill="currentColor" opacity=".7">${g}%</text>`).join("")}
    <path d="${line} L${X(9)} ${H - 26} L34 ${H - 26} Z" fill="${color}" opacity=".1"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${v.map((y, i) => `<g data-tip="${TENORS[i]} · ${y.toFixed(2)}%"><circle cx="${X(i)}" cy="${Y(y)}" r="4" fill="#06080a" stroke="${color}" stroke-width="2"/>
      <text x="${X(i)}" y="${Y(y) - 11}" font-size="9.5" font-family="IBM Plex Mono" fill="#dfe5ea" text-anchor="middle">${y.toFixed(2)}</text>
      <text x="${X(i)}" y="${H - 6}" font-size="9.5" font-family="IBM Plex Mono" fill="currentColor" text-anchor="middle" opacity=".7">${TENORS[i]}</text></g>`).join("")}
  </svg>`;
}

const heat = (p, max) => {
  const t = Math.max(-1, Math.min(1, p / (max || 3)));
  return t >= 0
    ? `background:rgba(41,208,139,${(0.1 + 0.5 * t).toFixed(2)});box-shadow:inset 0 0 0 1px rgba(41,208,139,${(0.25 + 0.5 * t).toFixed(2)})`

};

function tickerMarquee() {
  const one = TICK.map(
    (t) => `<span><b>${t[0]}</b> ${t[1].toLocaleString(undefined, { maximumFractionDigits: 4 })} <em style="font-style:normal;color:${t[2] >= 0 ? "var(--up)" : "var(--dn)"}">${sign(t[2])}%</em></span>`
  ).join("");
  return `<div class="marq"><div class="track">${one}${one}</div></div>`;
}

function sparkRow(seed, up, w = 84, h = 20) {
  return spark(series(44, seed, 0.03, up ? 0.0012 : -0.0012, 100), w, h, up ? "#29d08b" : "#ff5470", false);
}

.ledger .alert b{color:#ffce7a;font-weight:600}
.ledger .pagehd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--ink);padding:26px 0 12px;flex-wrap:wrap}

.ledger .sect{font:700 10.5px 'Archivo';letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin:0 0 14px;padding-bottom:7px;border-bottom:1px solid var(--ink)}

.ledger .main{padding-right:30px}

@media (max-width:940px){.ledger .cols{grid-template-columns:1fr}.ledger .main{padding-right:0}.ledger .rail{border-left:0;border-top:1px solid var(--ink);padding-left:0;margin-top:28px;padding-top:18px}}
.ledger .block{margin-bottom:34px}
.ledger table{width:100%;border-collapse:collapse}
.ledger th{font:700 9.5px 'Archivo';letter-spacing:.15em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 8px;border-bottom:1px solid var(--ink)}
.ledger th:first-child,.ledger td:first-child{text-align:left;padding-left:0}

.ledger .figcap{font:500 10.5px 'IBM Plex Mono';color:var(--mut);letter-spacing:.03em;margin-top:6px;line-height:1.5}
.ledger .dropcap::first-letter{font-family:'Fraunces',serif;font-weight:600;font-size:58px;line-height:.78;float:left;padding:6px 10px 0 0;color:var(--ink)}
.ledger .lead{font-family:'Instrument Serif',serif;font-size:19px;line-height:1.62;color:#26241f}
.ledger .body{font-size:14.5px;line-height:1.72;color:#33312b}
.ledger .body p{margin:0 0 14px}
.ledger .kicker{font:700 10.5px 'Archivo';letter-spacing:.2em;text-transform:uppercase;color:var(--oxb);margin-bottom:10px}
.ledger h3.title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0 0 8px;line-height:1.16}
.ledger .rail .item{border-bottom:1px solid var(--rule);padding:12px 0}
.ledger .rail .item:last-child{border-bottom:0}
.ledger .rail .item h4{font-family:'Fraunces',serif;font-size:16px;margin:5px 0 4px;line-height:1.28;font-weight:600}
.ledger .rail .item p{margin:0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.ledger .idx{font:700 11px 'IBM Plex Mono';color:var(--oxb)}
.ledger .fig{border:1px solid var(--ink);position:relative;overflow:hidden}
.ledger .fig img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.03)}
.ledger .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.ledger .stats div{padding:12px 14px;border-right:1px solid var(--rule)}
.ledger .stats div:last-child{border-right:0}
.ledger .stats .k{font:700 9.5px 'Archivo';letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
.ledger .stats .v{font-family:'IBM Plex Mono';font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums}
.ledger .stats .c{font-family:'IBM Plex Mono';font-size:11.5px}
.ledger .bar{height:7px;background:#e3ddd0;position:relative}
.ledger .bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.ledger .tagline{display:inline-block;font:700 9.5px 'Archivo';letter-spacing:.14em;padding:3px 7px;border:1px solid var(--ink);text-transform:uppercase}
.ledger .tagline.g{background:var(--grn);color:#f4f1ea;border-color:var(--grn)}
.ledger .tagline.o{background:var(--oxb);color:#f4f1ea;border-color:var(--oxb)}
.ledger .quote{font-family:'Instrument Serif',serif;font-size:20px;line-height:1.5;border-left:3px solid var(--oxb);padding-left:16px;margin:18px 0;color:#26241f}
.ledger .folio{border-top:3px double var(--ink);margin-top:34px;padding-top:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:500 11px 'IBM Plex Mono';color:var(--mut);letter-spacing:.06em}
.ledger .week{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--ink)}
.ledger .week>div{border-right:1px solid var(--rule);padding:12px}
.ledger .week>div:last-child{border-right:0}
.ledger .day{font:700 10px 'Archivo';letter-spacing:.16em;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:10px;display:flex;justify-content:space-between}
.ledger .ev{padding:8px 0;border-bottom:1px dotted var(--rule);font-size:12.5px;line-height:1.4}
.ledger .ev:last-child{border-bottom:0}
.ledger .ev b{display:block;font-weight:600}

@media (max-width:820px){.ledger .week{grid-template-columns:1fr}.ledger .stats{grid-template-columns:1fr 1fr}}
@media (max-width:880px){.ledger .block{overflow-x:auto}.ledger table{min-width:580px}.ledger .nav a{padding:11px 13px;font-size:10.5px}}
@media (prefers-reduced-motion:reduce){.ledger *{transition:none!important}}
`;

const grn = "#1c6b45", oxb = "#a8321f", blue = "#1b3a6b";

function hatch(id, color) {
  return `<pattern id="${id}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="6" stroke="${color}" stroke-width="3" opacity=".55"/></pattern>`;
}

const ink = () => "#14161a";
function areaPath(a, w, h, pad) { return path(a, w, h, pad) + ` L${w} ${h} L0 ${h} Z`; }

function macro() {

.strand .statrow{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

.strand .stat .k{font-size:10.5px;letter-spacing:.14em;color:#9a96b5;text-transform:uppercase;font-weight:600}
.strand .stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-family:'IBM Plex Mono'}
.strand .stat .c{font-size:12px;font-family:'IBM Plex Mono'}
.strand .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.strand .b3{grid-column:span 3}.strand .b4{grid-column:span 4}.strand .b5{grid-column:span 5}
.strand .b6{grid-column:span 6}.strand .b7{grid-column:span 7}.strand .b8{grid-column:span 8}.strand .b12{grid-column:span 12}
@media (max-width:1000px){.strand .bento>*{grid-column:span 12}}
.strand .tile{display:block;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:16px;padding:13px 15px;transition:.18s}
.strand .tile:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.5);background:rgba(255,255,255,.07)}
.strand .tile .k{font-size:12px;color:#a8a3c4;display:flex;justify-content:space-between;align-items:center}
.strand .tile .v{font-size:20px;font-weight:700;margin-top:5px;letter-spacing:-.02em;font-family:'IBM Plex Mono'}
.strand .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.strand .tiles{grid-template-columns:repeat(2,1fr)}}
.strand .seg{display:inline-flex;gap:4px;background:rgba(255,255,255,.05);padding:4px;border-radius:999px;border:1px solid var(--bd)}
.strand .seg button{background:transparent;border:0;color:#a8a3c4;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.strand .seg button:hover{color:#fff}
.strand .seg button.on{background:#fff;color:#100b1d}
.strand .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.strand .list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px}
.strand .list .it:last-child{border-bottom:0}
.strand .list .it:hover{background:rgba(255,255,255,.03);border-radius:10px}
.strand .rank{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font:700 11px 'IBM Plex Mono';background:rgba(139,92,246,.24);color:#c4b5fd}
.strand .chip{font-size:11.5px;padding:5px 11px;border-radius:999px;font-weight:600;border:1px solid var(--bd)}
.strand .chip.v{color:#c4b5fd;background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4)}
.strand .chip.c{color:#67e8f9;background:rgba(34,211,238,.13);border-color:rgba(34,211,238,.35)}
.strand .chip.a{color:#fcd34d;background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.35)}
.strand .chip.g{color:#6ee7b7;background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.35)}
.strand table{width:100%;border-collapse:collapse}
.strand th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8f8ab0;text-align:right;padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:600}
.strand th:first-child,.strand td:first-child{text-align:left}
.strand td{padding:11px 12px;font-size:13.5px;text-align:right;border-bottom:1px solid rgba(255,255,255,.055)}
.strand tbody tr:hover td{background:rgba(255,255,255,.04)}
.strand .sym{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font:700 11px 'IBM Plex Mono';margin-right:9px;vertical-align:middle}
.strand .pagehd{margin-bottom:20px}
.strand .pagehd h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.035em;margin:8px 0 6px;font-weight:800}
.strand .pagehd p{color:#a8a3c4;max-width:660px;font-size:14.5px;line-height:1.6;margin:0}
.strand .ringwrap{display:flex;align-items:center;gap:22px}
.strand .legend{display:flex;gap:8px;flex-wrap:wrap}
.strand .legend button{background:rgba(255,255,255,.05);border:1px solid var(--bd);color:#a8a3c4;font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;gap:7px;align-items:center}
.strand .legend button.on{color:#fff;border-color:rgba(255,255,255,.35)}
.strand .legend button i{width:9px;height:9px;border-radius:3px;display:block}
.strand .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.strand .bar i{display:block;height:100%;border-radius:99px}
.strand .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.strand .kv:last-child{border-bottom:0}
.strand .kv span{color:#9a96b5}
.strand .note{font-size:12px;color:#8f8ab0;line-height:1.55}
.strand .ft{border-top:1px solid var(--bd);padding:24px 0 44px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:12px;color:#8f8ab0}
@media (max-width:880px){.strand .card{overflow-x:auto}.strand table{min-width:600px}.strand .hero-in{padding:30px 22px}.strand .statrow{margin-left:0}}
@media (prefers-reduced-motion:reduce){.strand .marq .track,.strand .pill.live i{animation:none}}
`;
