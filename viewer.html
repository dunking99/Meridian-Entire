<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Design Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #111; color: #eee; font-family: sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 14px; background: #1b1b1b; border-bottom: 1px solid #2c2c2c; flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { font-size: 12px; color: #888; margin-right: 4px; text-transform: uppercase; letter-spacing: .06em; }
  button, a.btn { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
  button.active { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 600; }
  .spacer { flex: 1; }
  #subbar { display: none; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 14px; background: #161616; border-bottom: 1px solid #2c2c2c; }
  #subbar.show { display: flex; }
  main { flex: 1; position: relative; display: flex; justify-content: center; align-items: stretch; overflow: auto; background: #0b0b0b; }
  main.framed { padding: 16px; }
  iframe { border: 0; background: #fff; width: 100%; height: 100%; transition: width .2s ease; }
  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(11,11,11,.85); color: #bbb; }
</style>
</head>
<body>

<header>
  <div class="group">
    <span class="label">Design</span>
    <span id="design-buttons" class="group"></span>
  </div>

  <div class="group">
    <span class="label">Size</span>
    <button data-size="100%" class="size active">Desktop</button>
    <button data-size="820px" class="size">Tablet</button>
    <button data-size="390px" class="size">Phone</button>
  </div>

  <span class="spacer"></span>

  <div class="group">
    <button id="prev" title="Previous (left arrow)">&larr;</button>
    <button id="next" title="Next (right arrow)">&rarr;</button>
    <a id="open-tab" class="btn" target="_blank" rel="noopener">Open in new tab &nearr;</a>
  </div>
</header>

<div id="subbar">
  <span class="label">File</span>
  <span id="sub-buttons" class="group"></span>
  <span class="label" style="margin-left:12px;text-transform:none;letter-spacing:0">Each file has its own concept switcher inside the page.</span>
</div>

<main id="stage">
  <iframe id="frame" title="Design preview"></iframe>
  <div id="loading"><div>Loading design&hellip;</div></div>
</main>

<script>
  // ---- Settings you can edit ----------------------------------------
  const COUNT = 16;             // total number of designs
  const LAST_STATIC = 4;        // designs 1-4: built Vite sites (UI-Design-N/dist/)
  const NEXT_BASE_PORT = 4000;  // designs 5-11: Next.js server on port 4000 + N
                                // design 12: a single static page (UI-Design-12/index.html)

  // Designs 13-16: folders that hold several standalone HTML files.
  const GROUPS = {
    13: { name: "Portfolio page", files: [
      "Portfolio-Page-Directions.html" ] },
    14: { name: "Stock page", files: [
      "Four-Data-Rooms.html", "Four-New-Rooms.html",
      "Four-Page-Designs.html", "Four-Command-Rooms.html" ] },
    15: { name: "Charts and composition", files: [
      "Four-Distinct-Chart-Forms.html", "Five-Showcase-Concepts.html",
      "Five-Visual-Concepts.html", "Four-Composition-Concepts.html" ] },
    16: { name: "Briefing", files: [
      "Five-Briefing-Concepts-Filled-In.html" ] },
  };

  // Optional custom names for the number buttons. Leave empty for just numbers.
  const NAMES = {
    13: "Portfolio", 14: "Stock", 15: "Charts", 16: "Briefing",
  };
  // -------------------------------------------------------------------

  const pretty = (f) => f.replace(/\.html$/i, "").replace(/-/g, " ");
  const subChoice = {};   // remembered file index per group

  // Where each design lives
  function urlFor(n) {
    if (GROUPS[n]) {
      const i = subChoice[n] || 0;
      return `UI-Design-${n}/${encodeURIComponent(GROUPS[n].files[i])}`;
    }
    if (n === 12) return `UI-Design-12/`;
    if (n <= LAST_STATIC) return `UI-Design-${n}/dist/`;
    return `http://${location.hostname}:${NEXT_BASE_PORT + n}/`;
  }

  const frame = document.getElementById("frame");
  const stage = document.getElementById("stage");
  const loading = document.getElementById("loading");
  const openTab = document.getElementById("open-tab");
  const buttonWrap = document.getElementById("design-buttons");
  const subbar = document.getElementById("subbar");
  const subWrap = document.getElementById("sub-buttons");
  let current = 1;
  for (let i = 1; i <= COUNT; i++) {
    const b = document.createElement("button");
    b.textContent = NAMES[i] ? `${i} · ${NAMES[i]}` : i;
    b.dataset.n = i;
    b.addEventListener("click", () => select(i));
    buttonWrap.appendChild(b);
  }
  frame.addEventListener("load", () => { loading.style.display = "none"; });
  function buildSubbar(n) {
    subWrap.innerHTML = "";
    const g = GROUPS[n];
    if (!g || g.files.length < 2) { subbar.classList.remove("show"); return; }
    subbar.classList.add("show");
    g.files.forEach((f, i) => {
      const b = document.createElement("button");
      b.textContent = pretty(f);
      b.classList.toggle("active", i === (subChoice[n] || 0));
      b.addEventListener("click", () => {
        subChoice[n] = i;
        try { localStorage.setItem("ui-viewer-sub-" + n, i); } catch (e) {}
        select(n);
      });
      subWrap.appendChild(b);
    });
  }

  function select(n) {
    if (n < 1) n = COUNT;
    if (n > COUNT) n = 1;
    current = n;
    if (GROUPS[n] && subChoice[n] === undefined) {
      let saved = 0;
      try { saved = Number(localStorage.getItem("ui-viewer-sub-" + n)) || 0; } catch (e) {}
      subChoice[n] = (saved >= 0 && saved < GROUPS[n].files.length) ? saved : 0;
    }
    buildSubbar(n);
    loading.style.display = "flex";
    frame.src = urlFor(n);
    openTab.href = urlFor(n);
    buttonWrap.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", Number(b.dataset.n) === n)
    );
    try { localStorage.setItem("ui-viewer-current", n); } catch (e) {}
  }
  document.querySelectorAll("button.size").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("button.size").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      frame.style.width = b.dataset.size;
      stage.classList.toggle("framed", b.dataset.size !== "100%");
    });
  });
  document.getElementById("prev").addEventListener("click", () => select(current - 1));
  document.getElementById("next").addEventListener("click", () => select(current + 1));
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") select(current - 1);
    if (e.key === "ArrowRight") select(current + 1);
  });
  let start = 1;
  try { start = Number(localStorage.getItem("ui-viewer-current")) || 1; } catch (e) {}
  if (start < 1 || start > COUNT) start = 1;
  select(start);
</script>
</body>
</html>
