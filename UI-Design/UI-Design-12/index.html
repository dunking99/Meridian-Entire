<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MERIDIAN — design tokens
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080B; --bg1:#0C0E13; --bg2:#11141B; --bg3:#171B24; --bg4:#1D2230;
  --line:#1B2029; --line2:#2A3140;
  --txt:#E9EBF1; --txt2:#98A1B3; --txt3:#5E6779;
  --acc:#6E8BFF; --acc2:#8FA6FF; --acc-soft:rgba(110,139,255,.13);
  --up:#2ED08A; --up-soft:rgba(46,208,138,.11);
  --dn:#FF5F6D; --dn-soft:rgba(255,95,109,.11);
  --warn:#F0B44C; --warn-soft:rgba(240,180,76,.12);
  --r:13px; --r-sm:9px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232936;border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#333B4C}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--txt2)}

/* ============================================================
   RAIL
   ============================================================ */
.rail{
  width:62px;flex:0 0 62px;background:var(--bg1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:13px 0 12px;gap:5px;z-index:30;
}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(110,139,255,.22),rgba(110,139,255,.05));
  color:var(--acc);margin-bottom:14px;border:1px solid rgba(110,139,255,.22)}
.logo svg{width:19px;height:19px}
.railbtn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--txt3);cursor:pointer;position:relative;transition:background .15s,color .15s;
  border:none;background:transparent;
}
.railbtn:hover{background:var(--bg3);color:var(--txt2)}
.railbtn.active{background:var(--acc-soft);color:var(--acc)}
.railbtn.active::before{content:'';position:absolute;left:-13px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--acc)}
.railbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.railbtn::after{
  content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%) scale(.96);
  background:#1A1F2B;border:1px solid var(--line2);color:var(--txt);font-size:11.5px;font-weight:500;
  padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .12s,transform .12s;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.5)
}
.railbtn:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
.rail-spacer{flex:1}

/* ============================================================
   SHELL
   ============================================================ */
.app{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(9,11,15,.85);backdrop-filter:blur(14px);z-index:20;
}
.search{
  display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);
  border-radius:9px;padding:0 11px;height:33px;width:300px;color:var(--txt3);
  transition:border-color .15s,background .15s;cursor:text;
}
.search:hover{border-color:var(--line2)}
.search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.search span{font-size:12.5px;flex:1}
.kbd{font-family:var(--mono);font-size:10px;background:var(--bg4);border:1px solid var(--line2);
  border-radius:4px;padding:1.5px 5px;color:var(--txt3)}
.top-spacer{flex:1}
.market-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt2);
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:5px 11px 5px 9px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(46,208,138,.55);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,208,138,.5)}70%{box-shadow:0 0 0 7px rgba(46,208,138,0)}100%{box-shadow:0 0 0 0 rgba(46,208,138,0)}}
.clock{font-size:12px;color:var(--txt3);font-variant-numeric:tabular-nums}
.iconbtn{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;background:transparent;
  border:1px solid transparent;color:var(--txt3);cursor:pointer;transition:.15s;position:relative}
.iconbtn:hover{background:var(--bg3);color:var(--txt2)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .badge{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc);border:1.5px solid var(--bg1)}
.avatar{width:29px;height:29px;border-radius:50%;background:linear-gradient(140deg,#6E8BFF,#A78BFA);
  display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;cursor:pointer;letter-spacing:.02em}

.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 24px 90px;scroll-behavior:smooth}
.wrap{max-width:1480px;margin:0 auto}

/* ============================================================
   PAGE HEADER + TABS
   ============================================================ */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.ph-title{font-size:22px;font-weight:600;letter-spacing:-.025em}
.ph-sub{font-size:12.5px;color:var(--txt3);margin-top:3px;display:flex;align-items:center;gap:8px}
.ph-actions{display:flex;gap:8px;align-items:center}
.btn{
  height:33px;padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line2);
  background:var(--bg2);color:var(--txt2);transition:.15s;font-family:inherit;white-space:nowrap;
}
.btn:hover{background:var(--bg3);color:var(--txt);border-color:#37405233}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 2px 14px rgba(110,139,255,.28)}
.btn.primary:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}

.tabs{display:flex;gap:1px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:9px 15px;font-size:13px;font-weight:500;color:var(--txt3);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;
  white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;
}
.tab:hover{color:var(--txt2)}
.tab.active{color:var(--txt);border-bottom-color:var(--acc)}

/* ============================================================
   CARDS / GRID
   ============================================================ */
.grid{display:grid;gap:14px}
.g-main{grid-template-columns:minmax(0,1.66fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1240px){.g-main{grid-template-columns:1fr}.g-4{grid-template-columns:repeat(2,1fr)}.g-6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.g-2,.g-3,.g-4,.g-6{grid-template-columns:1fr}.search{width:170px}}
.mb14{margin-bottom:14px} .mb18{margin-bottom:18px}

.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.card-t{font-size:10.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--txt3)}
.card-link{font-size:11.5px;color:var(--acc);cursor:pointer;font-weight:500;display:flex;align-items:center;gap:3px}
.card-link:hover{color:var(--acc2)}
.card-sub{font-size:11.5px;color:var(--txt3);font-weight:400;letter-spacing:0;text-transform:none}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:18px 20px 12px}
.hero-top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.hero-label{font-size:10.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--txt3);margin-bottom:7px}
.hero-val{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.hero-chg{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:6px;font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.dn{background:var(--dn-soft);color:var(--dn)}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;padding-top:4px}
.hs{}
.hs-l{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px}
.hs-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.hs-s{font-size:11px;color:var(--txt3);margin-top:2px;font-variant-numeric:tabular-nums}

.chart-toolbar{display:flex;align-items:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:1px}
.seg button{
  border:none;background:transparent;color:var(--txt3);font-family:inherit;font-size:11.5px;font-weight:500;
  padding:4px 10px;border-radius:6px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.seg button:hover{color:var(--txt2)}
.seg button.on{background:var(--bg4);color:var(--txt)}
.seg button.on.acc{background:var(--acc-soft);color:var(--acc)}
.tb-spacer{flex:1}
.chart-host{position:relative;width:100%}
.chart-tip{
  position:absolute;top:4px;left:0;pointer-events:none;background:rgba(19,23,31,.97);
  border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:11.5px;
  opacity:0;transition:opacity .1s;white-space:nowrap;z-index:6;
  box-shadow:0 10px 30px rgba(0,0,0,.6);backdrop-filter:blur(10px);
}
.chart-tip .tt-d{color:var(--txt3);font-size:10.5px;margin-bottom:5px;letter-spacing:.02em}
.chart-tip .tt-r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chart-tip .tt-k{display:flex;align-items:center;gap:6px;color:var(--txt2)}
.chart-tip .tt-sw{width:7px;height:7px;border-radius:2px}
.chart-tip .tt-v{font-variant-numeric:tabular-nums;font-weight:600}

/* ============================================================
   TILES
   ============================================================ */
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile-l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);font-weight:600;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-v{font-size:18px;font-weight:600;letter-spacing:-.022em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile-s{font-size:11px;color:var(--txt3);margin-top:4px;font-variant-numeric:tabular-nums}

/* ============================================================
   TABLES
   ============================================================ */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{
  text-align:right;font-size:10px;font-weight:600;letter-spacing:.065em;text-transform:uppercase;
  color:var(--txt3);padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;
  user-select:none;transition:color .15s;position:relative;
}
table.tbl th:first-child,table.tbl td:first-child{text-align:left;padding-left:2px}
table.tbl th:last-child,table.tbl td:last-child{padding-right:2px}
table.tbl th:hover{color:var(--txt2)}
table.tbl th.sorted{color:var(--txt)}
table.tbl th.sorted::after{content:'';display:inline-block;margin-left:4px;border:3.5px solid transparent;border-top-color:var(--txt2);transform:translateY(2px)}
table.tbl th.sorted.asc::after{border-top-color:transparent;border-bottom-color:var(--txt2);transform:translateY(-2px)}
table.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(27,32,41,.6);font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tbody tr{transition:background .1s;cursor:pointer}
table.tbl tbody tr:hover{background:var(--bg2)}
table.tbl tbody tr.group-row{cursor:default;background:var(--bg2)}
table.tbl tbody tr.group-row:hover{background:var(--bg2)}
table.tbl tbody tr.group-row td{font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt2);padding:8px 10px}
table.tbl tfoot td{padding:10px;border-top:1px solid var(--line2);border-bottom:none;font-weight:600;font-size:12.5px}
.sym{display:flex;align-items:center;gap:9px}
.sym-t{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:-.01em}
.sym-n{font-size:11px;color:var(--txt3);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-avatar{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 26px;
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:-.03em;
  background:var(--bg3);color:var(--txt2);border:1px solid var(--line2)}
.chip{display:inline-flex;align-items:center;padding:1.5px 6px;border-radius:5px;font-size:10px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;background:var(--bg3);color:var(--txt3);border:1px solid var(--line2)}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:rgba(110,139,255,.24)}
.wbar{position:relative;height:4px;border-radius:4px;background:var(--bg4);width:52px;display:inline-block;vertical-align:middle;margin-right:7px;overflow:hidden}
.wbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc);display:block}

/* ============================================================
   ALLOCATION STRIP
   ============================================================ */
.strip{display:flex;height:9px;border-radius:6px;overflow:hidden;gap:1.5px;margin-bottom:14px}
.strip i{display:block;transition:opacity .15s;cursor:pointer}
.strip i:hover{opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt2);cursor:default}
.lg-sw{width:8px;height:8px;border-radius:2.5px;flex:0 0 8px}
.lg-v{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;margin-left:2px}
.lg-p{color:var(--txt3);font-variant-numeric:tabular-nums}

/* ============================================================
   MOVERS / LIST ROWS
   ============================================================ */
.mrow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid rgba(27,32,41,.55);cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow:hover .mrow-t{color:var(--acc)}
.mrow-t{font-family:var(--mono);font-size:11.5px;font-weight:500;transition:color .12s}
.mrow-n{font-size:10.5px;color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.mrow-r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.mrow-p{font-size:12.5px;font-weight:600}
.mrow-a{font-size:10.5px;color:var(--txt3)}

/* ============================================================
   PULSE / NEWS
   ============================================================ */
.pulse{display:flex;gap:10px;padding:10px 11px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);align-items:flex-start;cursor:pointer;transition:.14s}
.pulse:hover{border-color:var(--line2);background:var(--bg3)}
.pulse+.pulse{margin-top:7px}
.pulse-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:0 0 24px;
  font-size:11px;font-weight:700;font-family:var(--mono)}
.pulse-tx{font-size:12px;line-height:1.4;color:var(--txt2)}
.pulse-tx b{color:var(--txt);font-weight:600}
.pulse-meta{font-size:10.5px;color:var(--txt3);margin-top:3px}

.news{padding:10px 0;border-bottom:1px solid rgba(27,32,41,.55);cursor:pointer}
.news:last-child{border-bottom:none}
.news:hover .news-h{color:var(--acc2)}
.news-h{font-size:12.5px;line-height:1.4;font-weight:500;color:var(--txt);transition:color .12s}
.news-m{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:10.5px;color:var(--txt3)}
.news-tags{display:flex;gap:4px;margin-left:auto}
.tag{font-family:var(--mono);font-size:9.5px;font-weight:500;padding:1.5px 5px;border-radius:4px;
  background:var(--acc-soft);color:var(--acc);letter-spacing:-.01em}

.evt{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid rgba(27,32,41,.55)}
.evt:last-child{border-bottom:none}
.evt-d{width:38px;flex:0 0 38px;text-align:center}
.evt-dm{font-size:9.5px;text-transform:uppercase;color:var(--txt3);letter-spacing:.06em;font-weight:600}
.evt-dd{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

/* ============================================================
   HEATMAP / TREEMAP
   ============================================================ */
.tm{position:relative;width:100%;height:420px;border-radius:10px;overflow:hidden;background:var(--bg2)}
.tm-cell{position:absolute;border:1.5px solid var(--bg1);border-radius:6px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;cursor:pointer;transition:filter .15s;overflow:hidden;padding:3px}
.tm-cell:hover{filter:brightness(1.3);z-index:2}
.tm-t{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:-.02em}
.tm-p{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.85}

.mheat{display:grid;grid-template-columns:44px repeat(12,minmax(0,1fr)) 62px;gap:3px;font-size:11px}
.mheat .mh-h{text-align:center;font-size:10px;color:var(--txt3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding-bottom:5px}
.mheat .mh-y{font-weight:600;color:var(--txt2);display:flex;align-items:center;font-size:11.5px}
.mheat .mh-c{height:30px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:600;
  font-variant-numeric:tabular-nums;cursor:default;transition:transform .12s;color:var(--txt)}
.mheat .mh-c:hover{transform:scale(1.08);z-index:2;position:relative}
.mheat .mh-tot{display:flex;align-items:center;justify-content:flex-end;font-weight:600;font-variant-numeric:tabular-nums;font-size:11.5px}
.mheat .mh-c.empty{background:transparent;cursor:default}

/* ============================================================
   BARS (contribution, drift)
   ============================================================ */
.brow{display:grid;grid-template-columns:56px 1fr 78px;align-items:center;gap:11px;padding:5px 0}
.brow-k{font-family:var(--mono);font-size:11.5px;color:var(--txt2)}
.btrack{position:relative;height:18px;background:transparent;display:flex;align-items:center}
.btrack::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.bfill{position:absolute;height:11px;border-radius:3px;top:3.5px}
.brow-v{text-align:right;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}

.drift{display:grid;grid-template-columns:112px 1fr 92px;align-items:center;gap:12px;padding:7px 0}
.drift-l{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:7px}
.drift-track{position:relative;height:6px;background:var(--bg4);border-radius:4px}
.drift-track i{position:absolute;top:0;bottom:0;border-radius:4px;display:block}
.drift-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt2);border-radius:2px;opacity:.85}
.drift-v{text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--txt2)}

/* ============================================================
   MISC
   ============================================================ */

  const pts = values.map((v, i) => [

    h - 1.5 - ((v - min) / r) * (h - 3)
  ]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

  if (hi === lo) hi = lo + 1;
  const pad = (hi - lo) * 0.14;
  lo -= pad; hi += pad;

  const X = i => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = v => padT + ih - ((v - lo) / (hi - lo)) * ih;

  /* grid + y labels */
  let grid = '', ylab = '';
  const TICKS = 4;
  for (let i = 0; i <= TICKS; i++) {
    const v = lo + (hi - lo) * (i / TICKS);
    const y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL + iw}" y2="${y.toFixed(1)}" stroke="${C.line}" stroke-width="1"/>`;
    ylab += `<text x="${padL + iw + 9}" y="${(y + 3.6).toFixed(1)}" fill="${C.txt3}" font-size="10.5" font-family="Inter,sans-serif" font-variant-numeric="tabular-nums">${cfg.yFormat(v)}</text>`;
  }

  /* defs + paths */
  let defs = '', paths = '';
  series.forEach((s, si) => {
    const gid = 'g' + (gradSeq++);
    const d = s.values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    if (s.fill !== false) {
      defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
      </linearGradient>`;
      paths += `<path d="${d} L ${X(n - 1).toFixed(1)} ${(padT + ih).toFixed(1)} L ${X(0).toFixed(1)} ${(padT + ih).toFixed(1)} Z" fill="url(#${gid})"/>`;
    }
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 1.7}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`;
  });

  /* x labels */
  let xlab = '';
  if (cfg.xLabels && cfg.xLabels.length) {
    const idxs = n > 200 ? [0, Math.floor(n * 0.25), Math.floor(n * 0.5), Math.floor(n * 0.75), n - 1]
                         : [0, Math.floor(n / 2), n - 1];
    idxs.forEach(i => {
      const anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
      const lx = clamp(X(i), 6, W - 6);
      xlab += `<text x="${lx.toFixed(1)}" y="${H - 5}" text-anchor="${anchor}" fill="${C.txt3}" font-size="10.5" font-family="Inter,sans-serif">${cfg.xLabels[i]}</text>`;
    });
  }

  /* zero line for drawdown / return charts */
  let zero = '';
  if (cfg.zeroLine && lo < 0 && hi > 0) {
    zero = `<line x1="${padL}" y1="${Y(0).toFixed(1)}" x2="${padL + iw}" y2="${Y(0).toFixed(1)}" stroke="${C.line2}" stroke-width="1" stroke-dasharray="3 3"/>`;
  }

  host.innerHTML = `
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
      <defs>${defs}</defs>
      ${grid}${zero}${paths}${ylab}${xlab}
      <g class="cross" style="opacity:0;pointer-events:none">
        <line y1="${padT}" y2="${padT + ih}" stroke="${C.txt3}" stroke-width="1" stroke-dasharray="3 3"/>
        ${series.map(s => `<circle r="3.5" fill="${s.color}" stroke="${C.bg1}" stroke-width="1.6"/>`).join('')}
      </g>
      <rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hit" style="cursor:crosshair"/>
    </svg>`;

  /* tooltip */
  let tip = host.querySelector('.chart-tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; host.appendChild(tip); }

  const svg = host.querySelector('svg');
  const cross = svg.querySelector('.cross');
  const cline = cross.querySelector('line');
  const dots = Array.from(cross.querySelectorAll('circle'));
  const hit = svg.querySelector('.hit');

  hit.addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (W / rect.width);
    let i = Math.round(((px - padL) / iw) * (n - 1));
    i = clamp(i, 0, n - 1);
    const x = X(i);
    cline.setAttribute('x1', x); cline.setAttribute('x2', x);
    dots.forEach((dt, si) => { dt.setAttribute('cx', x); dt.setAttribute('cy', Y(series[si].values[i])); });
    cross.style.opacity = 1;
    tip.innerHTML = cfg.tooltip(i);
    tip.style.opacity = 1;
    const relX = x * (rect.width / W);
    const flip = relX > rect.width * 0.58;
    tip.style.left = (flip ? relX - 14 : relX + 14) + 'px';
    tip.style.transform = flip ? 'translateX(-100%)' : 'none';
  });
  hit.addEventListener('mouseleave', () => {
    cross.style.opacity = 0;
    tip.style.opacity = 0;
  });
}

/* ---------- donut ---------- */
function donutSVG(data, size = 190, innerRatio = 0.63) {
  const total = sum(data.map(d => d.value)) || 1;
  const r = size / 2, inner = r * innerRatio;
  let a0 = -Math.PI / 2, out = '';

  if (data.length === 1) {
    out = `<circle cx="${r}" cy="${r}" r="${(r + inner) / 2}" fill="none" stroke="${data[0].color}" stroke-width="${r - inner}" opacity=".92"/>`;
  } else {
    data.forEach((d, i) => {
      const a1 = a0 + (d.value / total) * Math.PI * 2;
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      const x0 = r + Math.cos(a0) * r, y0 = r + Math.sin(a0) * r;
      const x1 = r + Math.cos(a1) * r, y1 = r + Math.sin(a1) * r;
      const xi1 = r + Math.cos(a1) * inner, yi1 = r + Math.sin(a1) * inner;
      const xi0 = r + Math.cos(a0) * inner, yi0 = r + Math.sin(a0) * inner;
      out += `<path class="dn-slice" data-i="${i}" d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L ${xi1.toFixed(2)} ${yi1.toFixed(2)} A ${inner} ${inner} 0 ${large} 0 ${xi0.toFixed(2)} ${yi0.toFixed(2)} Z" fill="${d.color}" opacity=".9" style="transition:opacity .15s"/>`;
      a0 = a1;
    });
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">${out}</svg>`;
}

/* ---------- treemap ---------- */
function binaryTreemap(vals, x, y, w, h, out) {
  if (!vals.length) return;
  if (vals.length === 1) { out.push({ ...vals[0], x, y, w, h }); return; }
  const total = sum(vals.map(v => v.value)) || 1;
  let acc = 0, split = 0;
  for (let i = 0; i < vals.length; i++) {
    acc += vals[i].value;
    if (acc >= total / 2) { split = i + 1; break; }
  }
  split = clamp(split, 1, vals.length - 1);
  const a = vals.slice(0, split), b = vals.slice(split);
  const frac = sum(a.map(v => v.value)) / total;
  if (w >= h) {
    binaryTreemap(a, x, y, w * frac, h, out);
    binaryTreemap(b, x + w * frac, y, w * (1 - frac), h, out);
  } else {
    binaryTreemap(a, x, y, w, h * frac, out);
    binaryTreemap(b, x, y + h * frac, w, h * (1 - frac), out);
  }
}

function heatColor(pct) {
  const t = clamp(pct / 2.6, -1, 1);
  if (t >= 0) return `rgba(46,208,138,${(0.08 + t * 0.52).toFixed(2)})`;
  return `rgba(255,95,109,${(0.08 + (-t) * 0.52).toFixed(2)})`;
}

const heroState = { range: '1Y', mode: 'value', bench: true };

function drawHero() {
  const host = $('#heroChart');
  if (!host) return;
  const sl = sliceRange(heroState.range);
  const n = sl.pf.length;
  const series = [];

  if (heroState.mode === 'drawdown') {
    let peak = -Infinity;
    const dd = sl.pf.map(v => { peak = Math.max(peak, v); return (v / peak - 1) * 100; });
    series.push({ name: 'Drawdown', values: dd, color: C.dn, fill: true });
  } else if (heroState.mode === 'return') {
    const base = sl.pf[0];
    series.push({ name: 'Portfolio', values: sl.pf.map(v => (v / base - 1) * 100), color: C.acc, fill: true });
    if (heroState.bench && sl.bm) {
      const b0 = sl.bm[0];
      series.push({ name: 'S&P 500', values: sl.bm.map(v => (v / b0 - 1) * 100), color: C.txt3, fill: false, dash: '4 3', width: 1.4 });
    }
  } else {
    series.push({ name: 'Portfolio', values: sl.pf, color: C.acc, fill: true });
    if (heroState.bench && sl.bm) {
      const b0 = sl.bm[0], p0 = sl.pf[0];
      series.push({ name: 'S&P 500', values: sl.bm.map(v => v / b0 * p0), color: C.txt3, fill: false, dash: '4 3', width: 1.4 });
    }
  }

  const isPct = heroState.mode !== 'value';
  lineChart(host, {
    height: 300,
    series,
    zeroLine: heroState.mode === 'drawdown',
    xLabels: sl.labels,
    yFormat: v => isPct ? (v >= 0 ? '+' : '') + v.toFixed(1) + '%' : fmtCompact(v),
    tooltip: i => {
      const rows = series.map(s => {
        const v = s.values[i];
        return `<div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:${s.color}"></span>${s.name}</span>
        <span class="tt-v" style="color:${s.color === C.txt3 ? C.txt2 : C.txt}">${heroState.mode === 'value' ? fmtMoney(v, 0) : (v >= 0 ? '+' : '') + v.toFixed(2) + '%'}</span></div>`;
      }).join('');
      return `<div class="tt-d">${sl.labels[i]}${sl.intraday ? ' · ' + sl.labels[i] : ''}</div>${rows}`;
    }
  });
}

const holdState = { sort: 'mv', dir: -1, group: 'none', q: '', filter: 'all', view: 'table' };

function holdingsFiltered() {
  let list = HOLDINGS.slice();
  if (holdState.filter !== 'all') {
    if (holdState.filter === 'Equity')   list = list.filter(h => h.assetClass.includes('Equity'));
    else if (holdState.filter === 'Fund')list = list.filter(h => !h.assetClass.includes('Equity'));
    else if (holdState.filter === 'win') list = list.filter(h => h.pnl > 0);
    else if (holdState.filter === 'los') list = list.filter(h => h.pnl < 0);
  }
  if (holdState.q) {
    const q = holdState.q.toLowerCase();
    list = list.filter(h => h.ticker.toLowerCase().includes(q) || h.name.toLowerCase().includes(q) || h.sector.toLowerCase().includes(q));
  }
  return list;
}
function sortList(list) {
  const k = holdState.sort, d = holdState.dir;
  return list.slice().sort((a, b) => {
    let va = a[k], vb = b[k];
    if (typeof va === 'string') return va.localeCompare(vb) * d;
    return (va - vb) * d;
  });
}

function pageHoldings() {
  return {
    html: `
      ${pageHead('Holdings',
        `<span>${HOLDINGS.length} positions</span><span style="color:var(--line2)">·</span><span>Market value ${fmtMoney(MV_TOTAL, 0)}</span>`,
        `<button class="btn ghost"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add position</button>`)}
      ${tabBar('holdings')}

      <section class="card">
        <div class="card-h" style="margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div class="seg" id="hView">
            <button data-v="table" class="${holdState.view === 'table' ? 'on acc' : ''}">Table</button>
            <button data-v="heat" class="${holdState.view === 'heat' ? 'on acc' : ''}">Heatmap</button>
          </div>
          <div class="seg" id="hFilter">
            <button data-f="all" class="${holdState.filter === 'all' ? 'on' : ''}">All</button>
            <button data-f="Equity" class="${holdState.filter === 'Equity' ? 'on' : ''}">Equities</button>
            <button data-f="Fund" class="${holdState.filter === 'Fund' ? 'on' : ''}">Funds</button>
            <button data-f="win" class="${holdState.filter === 'win' ? 'on' : ''}">Winners</button>
            <button data-f="los" class="${holdState.filter === 'los' ? 'on' : ''}">Losers</button>
          </div>
          <div class="tb-spacer"></div>
          <div class="seg" id="hGroup">
            <button data-g="none" class="${holdState.group === 'none' ? 'on' : ''}">No grouping</button>
            <button data-g="sector" class="${holdState.group === 'sector' ? 'on' : ''}">Sector</button>
            <button data-g="assetClass" class="${holdState.group === 'assetClass' ? 'on' : ''}">Asset class</button>
          </div>
          <input id="hSearch" placeholder="Filter…" value="${holdState.q}"
            style="height:30px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;
                   color:var(--txt);font-family:inherit;font-size:12.5px;padding:0 11px;width:150px;outline:none"/>
        </div>
        <div id="hBody"></div>
      </section>`,
    mount() {
      $('#hView').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        holdState.view = b.dataset.v;
        $$('#hView button').forEach(x => { x.classList.toggle('on', x === b); x.classList.toggle('acc', x === b); });
        drawHoldings();
      });
      $('#hFilter').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        holdState.filter = b.dataset.f;
        $$('#hFilter button').forEach(x => x.classList.toggle('on', x === b));
        drawHoldings();
      });
      $('#hGroup').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        holdState.group = b.dataset.g;
        $$('#hGroup button').forEach(x => x.classList.toggle('on', x === b));
        drawHoldings();
      });
      $('#hSearch').addEventListener('input', e => {
        holdState.q = e.target.value;
        drawHoldings();
      });
      drawHoldings();
    }
  };
}

function drawHoldings() {
  const body = $('#hBody');
  if (!body) return;
  let list = sortList(holdingsFiltered());

  if (!list.length) { body.innerHTML = `<div class="empty-state">No positions match the current filters.</div>`; return; }

  /* ---------- HEATMAP VIEW ---------- */
  if (holdState.view === 'heat') {
    const W = body.clientWidth || 900, H = 420;
    const items = list.slice().sort((a, b) => b.mv - a.mv).map(h => ({ ...h, value: h.mv }));
    const out = [];
    binaryTreemap(items, 0, 0, W, H, out);

    body.innerHTML = `<div class="tm" style="height:${H}px">
      ${out.map(c => {
        const w = c.w - 3, hgt = c.h - 3;
        const showLabel = w > 46 && hgt > 26;
        const showPct = w > 46 && hgt > 42;
        return `<div class="tm-cell" data-ticker="${c.ticker}"
          style="left:${c.x + 1.5}px;top:${c.y + 1.5}px;width:${w}px;height:${hgt}px;background:${heatColor(c.dayPct)}">
          ${showLabel ? `<div class="tm-t">${c.ticker}</div>` : ''}
          ${showPct ? `<div class="tm-p">${fmtPct(c.dayPct, 1)}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin-top:14px;font-size:11px;color:var(--txt3)">
      <span style="font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:10px">Today's change</span>
      <span style="display:flex;align-items:center;gap:5px">
        ${[-2.5,-1.5,-0.5,0.5,1.5,2.5].map(v => `<span style="width:26px;height:10px;border-radius:3px;background:${heatColor(v)}"></span>`).join('')}
      </span>
      <span style="display:flex;justify-content:space-between;width:170px">
        <span>−2.5%</span><span>0</span><span>+2.5%</span>
      </span>
      <span style="margin-left:auto">Cell area = position weight</span>
    </div>`;
    return;
  }

  /* ---------- TABLE VIEW ---------- */
  const cols = [
    ['ticker','Position','left'],
    ['qty','Qty',null],
    ['avgCost','Avg cost',null],
    ['price','Last',null],
    ['dayPct','Today',null],
    ['mv','Market value',null],
    ['w','Weight',null],
    ['pnl','Unrealized P&L',null],
    ['ret1m','30D',null],
  ];
  const head = cols.map(([k, l, al]) => {
    const sorted = holdState.sort === k;
    return `<th data-k="${k}" class="${sorted ? 'sorted ' + (holdState.dir > 0 ? 'asc' : '') : ''}" style="${al ? 'text-align:' + al : ''}">${l}</th>`;
  }).join('') + `<th></th>`;

  const renderRow = h => `
    <tr data-ticker="${h.ticker}">
      <td><div class="sym">${tkAvatar(h.ticker)}<div><div class="sym-t">${h.ticker}</div><div class="sym-n">${h.name}</div></div></div></td>
      <td>${fmtNum(h.qty, 0)}</td>
      <td>${fmtMoney(h.avgCost)}</td>
      <td>${fmtMoney(h.price)}</td>
      <td class="${toneOf(h.dayPct)}">${fmtPct(h.dayPct)}
        <div style="font-size:10px;opacity:.65">${sgn(h.day)}</div></td>
      <td>${fmtMoney(h.mv, 0)}</td>
      <td><span class="wbar"><i style="width:${clamp(h.w / 12 * 100, 4, 100)}%"></i></span>${h.w.toFixed(2)}%</td>
      <td class="${toneOf(h.pnl)}">${sgn(h.pnl)}
        <div style="font-size:10px;opacity:.65">${fmtPct(h.pnlPct)}</div></td>
      <td>${sparkSVG(h.spark, { color: h.ret1m >= 0 ? C.up : C.dn, w: 62, h: 20 })}</td>
      <td style="color:var(--txt3);font-size:14px">›</td>
    </tr>`;

  let rowsHtml = '';
  if (holdState.group === 'none') {
    rowsHtml = list.map(renderRow).join('');
  } else {
    const key = holdState.group;
    const groups = {};
    list.forEach(h => { (groups[h[key]] = groups[h[key]] || []).push(h); });
    Object.keys(groups).sort().forEach(g => {
      const items = groups[g];
      const gmv = sum(items.map(x => x.mv));
      const gday = sum(items.map(x => x.day));
      rowsHtml += `<tr class="group-row"><td colspan="5">${g} <span style="color:var(--txt3);font-weight:400">· ${items.length}</span></td>
        <td>${fmtMoney(gmv, 0)}</td><td>${(gmv / TOTAL * 100).toFixed(2)}%</td>
        <td class="${toneOf(gday)}">${sgn(gday)}</td><td colspan="2"></td></tr>`;
      rowsHtml += items.map(renderRow).join('');
    });
  }

  const fmv = sum(list.map(h => h.mv));
  const fcost = sum(list.map(h => h.cost));
  const fpnl = fmv - fcost;

  body.innerHTML = `
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>${head}</tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr>
          <td>Total · ${list.length}</td>
          <td colspan="4"></td>
          <td>${fmtMoney(fmv, 0)}</td>
          <td>${(fmv / TOTAL * 100).toFixed(2)}%</td>
          <td class="${toneOf(fpnl)}">${sgn(fpnl)}</td>
          <td colspan="2"></td>
        </tr></tfoot>
      </table>
    </div>`;

  $$('#hBody th[data-k]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k;
    if (holdState.sort === k) holdState.dir *= -1;
    else { holdState.sort = k; holdState.dir = ['ticker'].includes(k) ? 1 : -1; }
    drawHoldings();
  }));
}

/* ============================================================================
   7. PAGE — PERFORMANCE
   ============================================================================ */
const perfState = { range: '1Y', bench: true };

function perfStats(pf, bm) {
  const rets = [];
  for (let i = 1; i < pf.length; i++) rets.push(pf[i] / pf[i - 1] - 1);
  const mean = sum(rets) / rets.length;
  const varr = sum(rets.map(r => (r - mean) ** 2)) / Math.max(rets.length - 1, 1);
  const vol = Math.sqrt(varr * 252) * 100;
  const yrs = rets.length / 252;
  const totalRet = pf[pf.length - 1] / pf[0] - 1;
  const cagr = (Math.pow(pf[pf.length - 1] / pf[0], 1 / Math.max(yrs, 0.05)) - 1) * 100;
  const rf = 4.2;
  const sharpe = vol > 0 ? (cagr - rf) / vol : 0;
  let peak = -Infinity, mdd = 0;
  pf.forEach(v => { peak = Math.max(peak, v); mdd = Math.min(mdd, v / peak - 1); });
  let beta = 1, bCagr = 0;
  if (bm && bm.length === pf.length) {
    const br = [];
    for (let i = 1; i < bm.length; i++) br.push(bm[i] / bm[i - 1] - 1);
    const bmMean = sum(br) / br.length;
    let cov = 0, bvar = 0;
    for (let i = 0; i < rets.length; i++) { cov += (rets[i] - mean) * (br[i] - bmMean); bvar += (br[i] - bmMean) ** 2; }
    beta = bvar ? cov / bvar : 1;
    bCagr = (Math.pow(bm[bm.length - 1] / bm[0], 1 / Math.max(yrs, 0.05)) - 1) * 100;
  }
  const alpha = cagr - (rf + beta * (bCagr - rf));
  const wins = rets.filter(r => r > 0).length;
  const best = Math.max(...rets) * 100, worst = Math.min(...rets) * 100;
  return { vol, cagr, totalRet: totalRet * 100, sharpe, mdd: mdd * 100, beta, alpha, bCagr,
           winRate: wins / rets.length * 100, best, worst };
}

function monthlyReturns() {
  const map = new Map();
  for (let i = 0; i < DATES.length; i++) {
    const d = DATES[i];
    const k = d.getFullYear() + '-' + d.getMonth();
    if (!map.has(k)) map.set(k, { y: d.getFullYear(), m: d.getMonth(), first: PF[i], last: PF[i] });
    else map.get(k).last = PF[i];
  }
  const keys = [...map.keys()].sort((a, b) => {
    const [ay, am] = a.split('-').map(Number), [by, bm2] = b.split('-').map(Number);
    return ay - by || am - bm2;
  });
  const out = {};
  let prevLast = null;
  keys.forEach(k => {
    const v = map.get(k);
    const r = prevLast === null ? (v.last / v.first - 1) * 100 : (v.last / prevLast - 1) * 100;
    (out[v.y] = out[v.y] || {})[v.m] = r;
    prevLast = v.last;
  });
  return out;
}

function drawPerfChart() {
  const host = $('#perfChart');
  if (!host) return;
  const sl = sliceRange(perfState.range);
  const series = [];
  const base = sl.pf[0];
  series.push({ name: 'Portfolio', values: sl.pf.map(v => (v / base - 1) * 100), color: C.acc, fill: true });
  if (perfState.bench && sl.bm) {
    const b0 = sl.bm[0];
    series.push({ name: 'S&P 500', values: sl.bm.map(v => (v / b0 - 1) * 100), color: C.txt3, fill: false, dash: '4 3', width: 1.4 });
  }
  lineChart(host, {
    height: 320,
    series, zeroLine: true,
    xLabels: sl.labels,
    yFormat: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%',
    tooltip: i => `<div class="tt-d">${sl.labels[i]}</div>` + series.map(s =>
      `<div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:${s.color}"></span>${s.name}</span>
       <span class="tt-v" style="color:${s.color === C.txt3 ? C.txt2 : C.txt}">${(s.values[i] >= 0 ? '+' : '') + s.values[i].toFixed(2)}%</span></div>`).join('')
  });
}

function drawAlloc() {
  const body = $('#allocBody');
  if (!body) return;
  const dim = DIMS[allocDim];
  let groups = groupBy(HOLDINGS, dim.key, h => h.mv);
  if (allocDim === 'asset') groups.push({ label: 'Cash', value: CASH });
  groups.sort((a, b) => b.value - a.value);
  const data = groups.map((g, i) => ({ ...g, color: PALETTE[i % PALETTE.length], pct: g.value / TOTAL * 100 }));

  /* concentration metrics */
  const sorted = [...HOLDINGS].sort((a, b) => b.mv - a.mv);
  const top10 = sum(sorted.slice(0, 10).map(h => h.mv)) / TOTAL * 100;
  const hhi = sum(HOLDINGS.map(h => (h.w / 100) ** 2)) * 10000;
  const effN = 10000 / hhi;
  const largest = sorted[0];

  /* drift vs targets (asset class only) */
  const drift = Object.entries(TARGETS).map(([label, target]) => {
    const g = data.find(d => d.label === label);
    return { label, target, actual: g ? g.pct : 0, color: g ? g.color : '#666' };
  }).sort((a, b) => (b.actual - b.target) - (a.actual - a.target));

  body.innerHTML = `
    <div class="grid g-main mb14">

            </div>
          </div>

            ${data.map(d => `
              <div style="display:flex;align-items:center;gap:10px">
                <span style="width:9px;height:9px;border-radius:3px;background:${d.color};flex:0 0 9px"></span>
                <span style="font-size:12.5px;flex:1;color:var(--txt2)">${d.label}</span>
                <span style="font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--txt3)">${fmtCompact(d.value)}</span>
                <span style="font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;width:52px;text-align:right">${d.pct.toFixed(1)}%</span>
              </div>`).join('')}
          </div>
        </div>
      </section>

      <div>
        <section class="card mb14">
          <div class="card-h"><div class="card-t">Concentration</div></div>
          <div class="grid g-2" style="gap:10px">
            ${tile('Largest position', largest.ticker, `${largest.w.toFixed(1)}% of portfolio`)}
            ${tile('Top 10 weight', top10.toFixed(1) + '%', `${HOLDINGS.length} total positions`)}
            ${tile('HHI', Math.round(hhi).toString(), 'Herfindahl index')}
            ${tile('Effective N', effN.toFixed(1), 'diversification measure')}
          </div>
        </section>

        <section class="card">
          <div class="card-h"><div class="card-t">Portfolio composition</div></div>
          <div class="kv"><span class="kv-k">Equities</span><span class="kv-v">${(sum(HOLDINGS.filter(h=>h.assetClass.includes('Equity')).map(h=>h.mv))/TOTAL*100).toFixed(1)}%</span></div>
          <div class="kv"><span class="kv-k">Fixed income</span><span class="kv-v">${(sum(HOLDINGS.filter(h=>h.assetClass==='Fixed Income').map(h=>h.mv))/TOTAL*100).toFixed(1)}%</span></div>

      <div id="allocTM" class="tm"></div>
    </section>`;

  /* treemap */
  const tmHost = $('#allocTM');
  if (tmHost) {
    const W = tmHost.clientWidth || 900, H = 420;
    const items = [...HOLDINGS].sort((a, b) => b.mv - a.mv).map(h => ({ ...h, value: h.mv }));
    const out = [];
    binaryTreemap(items, 0, 0, W, H, out);
    tmHost.innerHTML = out.map(c => {
      const w = c.w - 3, hh = c.h - 3;
      const showLabel = w > 46 && hh > 26;
      return `<div class="tm-cell" data-ticker="${c.ticker}"

        ${showLabel ? `<div class="tm-t">${c.ticker}</div>` : ''}
        ${showLabel && hh > 42 ? `<div class="tm-p">${c.w.toFixed(1)}%</div>` : ''}

  /* donut hover */
  const dh = $('#donutHost');

    });
  }
}

        `<button class="btn ghost">Reinvest settings</button>`)}
      ${tabBar('income')}

      <div class="grid g-4 mb14">
        ${tile('Trailing 12M income', fmtMoney(TTM_INCOME, 0), `${(TTM_INCOME / TOTAL * 100).toFixed(2)}% yield on value`)}
        ${tile('Projected 12M', fmtMoney(PROJ_INCOME, 0), `${fmtPct((PROJ_INCOME / TTM_INCOME - 1) * 100)} vs trailing`, 'up')}
        ${tile('Yield on cost', yieldOnCost.toFixed(2) + '%', `Cost basis ${fmtMoney(COST_TOTAL, 0)}`)}
        ${tile('Next payout', fmtMoney(INC_PROJ[0], 0), `${monthsFwd[0]} · est.`, '')}
      </div>

      <section class="card mb14">
        <div class="card-h">
          <div class="card-t">Monthly income</div>
          <div style="display:flex;gap:14px;font-size:11px;color:var(--txt3)">
            <span style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:2px;background:var(--up)"></span>Received</span>
            <span style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:2px;background:var(--acc);opacity:.45"></span>Projected</span>
          </div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:10px">
          ${INC_RECEIVED.map((v, i) => `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
              <div style="font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums">${v}</div>
              <div style="width:100%;max-width:34px;height:${(v / maxBar * 130).toFixed(0)}px;background:linear-gradient(180deg,var(--up),rgba(46,208,138,.4));border-radius:4px 4px 2px 2px"></div>
              <div style="font-size:10px;color:var(--txt3);font-weight:600">${monthsBack[i]}</div>
            </div>`).join('')}
          <div style="width:1px;height:100%;background:var(--line2);margin:0 6px"></div>
          ${INC_PROJ.map((v, i) => `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
              <div style="font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums">${v}</div>
              <div style="width:100%;max-width:34px;height:${(v / maxBar * 130).toFixed(0)}px;background:rgba(110,139,255,.35);border:1px dashed rgba(110,139,255,.6);border-radius:4px 4px 2px 2px"></div>
              <div style="font-size:10px;color:var(--txt3);font-weight:600">${monthsFwd[i]}</div>
            </div>`).join('')}
        </div>
      </section>

      <div class="grid g-main">
        <section class="card">
          <div class="card-h"><div class="card-t">Income by holding · annualized</div><div class="card-sub">${incomeByHolding.length} payers</div></div>
          ${incomeByHolding.map(h => `
            <div class="brow" style="grid-template-columns:64px 1fr 90px" data-ticker="${h.ticker}">
              <div class="brow-k">${h.ticker}</div>
              <div class="btrack" style="height:20px">
                <div class="bfill" style="left:0;width:${(h.annual / incomeByHolding[0].annual * 100).toFixed(1)}%;background:linear-gradient(90deg,rgba(46,208,138,.85),rgba(46,208,138,.35))"></div>
                <span style="position:absolute;left:8px;top:2px;font-size:10.5px;color:var(--txt2)">${h.divYield.toFixed(2)}%</span>
              </div>
              <div class="brow-v">${fmtMoney(h.annual, 0)}</div>
            </div>`).join('')}
        </section>

        <div>
          <section class="card mb14">
            <div class="card-h"><div class="card-t">Upcoming payments</div></div>
            ${EVENTS.filter(e => e.type === 'Ex-div' || e.type === 'Distribution').map(e => `
              <div class="evt" data-ticker="${e.ticker}">
                <div class="evt-d"><div class="evt-dm">${MON[e.d.getMonth()]}</div><div class="evt-dd">${e.d.getDate()}</div></div>
                <div>
                  <div style="font-size:12.5px;font-weight:500">${e.ticker}</div>
                  <div style="font-size:10.5px;color:var(--txt3)">${e.type}</div>
                </div>
                <div style="margin-left:auto;text-align:right">
                  <div style="font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums">
                    ${fmtMoney((HOLDINGS.find(h => h.ticker === e.ticker)?.qty || 0) * parseFloat((e.note.match(/\$([\d.]+)/) || [0, 0])[1]), 2)}
                  </div>
                  <div style="font-size:10.5px;color:var(--txt3)">${e.note}</div>
                </div>
              </div>`).join('')}
          </section>

          <section class="card">
            <div class="card-h"><div class="card-t">Income quality</div></div>
            <div class="kv"><span class="kv-k">Qualified dividends</span><span class="kv-v">${(TTM_INCOME * 0.71).toFixed(0) !== '' ? fmtMoney(TTM_INCOME * 0.71, 0) : ''}</span></div>
            <div class="kv"><span class="kv-k">Ordinary / interest</span><span class="kv-v">${fmtMoney(TTM_INCOME * 0.29, 0)}</span></div>
            <div class="kv"><span class="kv-k">Est. withholding tax</span><span class="kv-v">${fmtMoney(TTM_INCOME * 0.09, 0)}</span></div>
            <div class="divider"></div>
            <div class="kv"><span class="kv-k">Payers</span><span class="kv-v">${incomeByHolding.length} of ${HOLDINGS.length}</span></div>
            <div class="kv"><span class="kv-k">Largest payer</span><span class="kv-v">${incomeByHolding[0].ticker} · ${fmtMoney(incomeByHolding[0].annual, 0)}</span></div>
            <div class="kv"><span class="kv-k">Cash drag on yield</span><span class="kv-v">${(CASH * 0.042).toFixed(0) ? fmtMoney(CASH * 0.042, 0) : ''} potential</span></div>
          </section>
        </div>
      </div>`,
    mount() {}
  };
}

/* ============================================================================
   11. ROUTER
   ============================================================================ */
let redrawFns = [];
let current = { view: 'overview', param: null };

const PAGES = {
  overview: pageOverview,
  holdings: pageHoldings,
  performance: pagePerformance,
  allocation: pageAllocation,
  activity: pageActivity,
  income: pageIncome,
};

function navigate(view, param) {
  current = { view, param };
  render();
  $('.page').scrollTop = 0;
}

function render() {
  redrawFns = [];
  const root = $('#root');
  const def = current.view === 'holding'
    ? pageHolding(current.param)
    : (PAGES[current.view] || pageOverview)();

  root.innerHTML = def.html;
  requestAnimationFrame(() => {
    if (def.mount) def.mount();
  });
}

/* ---------- global delegation ---------- */
document.addEventListener('click', e => {
  /* rail (non-portfolio areas are placeholders) */
  const rail = e.target.closest('[data-nav]');
  if (rail) {
    if (rail.dataset.nav !== 'portfolio') {
      $$('.railbtn').forEach(b => b.classList.remove('active'));
      rail.classList.add('active');
      $('#root').innerHTML = `<div class="empty-state" style="padding:120px 20px">
        <div style="font-size:15px;font-weight:600;color:var(--txt2);margin-bottom:6px">${rail.dataset.tip}</div>
        <div>This area is outside the Portfolio module of the prototype.</div>
      </div>`;
      return;
    }
    $$('.railbtn').forEach(b => b.classList.remove('active'));
    rail.classList.add('active');
    navigate('overview');
    return;
  }

  /* tabs */
  const tab = e.target.closest('[data-tab]');
  if (tab) { navigate(tab.dataset.tab); return; }

  /* ticker drill-down */
  const tk = e.target.closest('[data-ticker]');
  if (tk && !tk.closest('[data-tab]')) {
    const t = tk.dataset.ticker;
    if (HOLDINGS.some(h => h.ticker === t)) { navigate('holding', t); }
    return;
  }
});

/* ---------- resize ---------- */
let rT;
window.addEventListener('resize', () => {
  clearTimeout(rT);
  rT = setTimeout(() => {
    redrawFns.forEach(fn => { try { fn(); } catch (err) {} });
    if (current.view === 'allocation' || current.view === 'holdings') {
      /* treemap re-layout */
      const def = PAGES[current.view] ? PAGES[current.view]() : null;
      if (def) { $('#root').innerHTML = def.html; requestAnimationFrame(() => def.mount && def.mount()); }
    }
  }, 160);
});

/* ---------- clock ---------- */
function tickClock() {
  const d = new Date();
  const el = $('#clock');
  if (el) el.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}
tickClock(); setInterval(tickClock, 30000);

/* ---------- boot ---------- */
render();
</script>
