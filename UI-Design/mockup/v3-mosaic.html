function layRow(row,x,y,w,h,out){var s=0;row.forEach(function(r){s+=r.area;});if(w>=h){var cw=s/h,yy=y;row.forEach(function(r){var rh=r.area/cw;out[r.key]={x:x,y:yy,w:cw,h:rh};yy+=rh;});return {x:x+cw,y:y,w:w-cw,h:h};}else{var rh2=s/w,xx=x;row.forEach(function(r){var cw2=r.area/rh2;out[r.key]={x:xx,y:y,w:cw2,h:rh2};xx+=cw2;});return {x:x,y:y+rh2,w:w,h:h-rh2};}}
function squarify(items,x,y,w,h){var out={},tot=items.reduce(function(s,i){return s+i.v;},0);items=items.map(function(i){return {key:i.key,area:i.v/tot*w*h};}).sort(function(a,b){return b.area-a.area;});
  var row=[],rest=items.slice(),rect={x:x,y:y,w:w,h:h};while(rest.length){var side=Math.min(rect.w,rect.h),nx=rest[0],nr=row.concat([nx]);if(!row.length||worst(nr,side)<=worst(row,side)){row=nr;rest.shift();}else{rect=layRow(row,rect.x,rect.y,rect.w,rect.h,out);row=[];}}
  if(row.length)layRow(row,rect.x,rect.y,rect.w,rect.h,out);return out;}

function layout(){var W=map.clientWidth,Ht=map.clientHeight,rects={};
  if(!S.grp){var r=squarify(H.map(function(h){return {key:h.t,v:sizeVal(h)};}),0,0,W,Ht);rects=r;Object.keys(grps).forEach(function(c){grps[c].style.opacity=0;});}
  else{var cv={};H.forEach(function(h){cv[h.c]=(cv[h.c]||0)+sizeVal(h);});var cr=squarify(Object.keys(cv).map(function(c){return {key:c,v:cv[c]};}),0,0,W,Ht);
    Object.keys(cr).forEach(function(c){var R=cr[c],g=grps[c];g.style.left=R.x+'px';g.style.top=R.y+'px';g.style.width=R.w+'px';g.style.height=R.h+'px';g.style.opacity=1;g.querySelector('b').textContent=c+' · '+(cv[c]/Object.keys(cv).reduce(function(s,k){return s+cv[k];},0)*100).toFixed(0)+'%';
      var inner=squarify(H.filter(function(h){return h.c===c;}).map(function(h){return {key:h.t,v:sizeVal(h)};}),R.x+5,R.y+28,Math.max(10,R.w-10),Math.max(10,R.h-33));Object.keys(inner).forEach(function(k){rects[k]=inner[k];});});}
  H.forEach(function(h){var R=rects[h.t],d=tiles[h.t],c=colorFor(h);if(!R)return;d.style.left=R.x+'px';d.style.top=R.y+'px';d.style.width=R.w+'px';d.style.height=R.h+'px';d.style.background=c[0];d.style.color=c[1];
    var big=R.w>170&&R.h>110,mid=R.w>84&&R.h>62;var tk=d.querySelector('.tk');tk.textContent=h.t;tk.style.fontSize=big?Math.min(R.w*.32,R.h*.36,96)+'px':mid?'30px':R.w>50?'18px':'12px';
    d.querySelector('.nm').style.display=big?'block':'none';d.querySelector('.nm').textContent=h.n;var mt=d.querySelector('.mt');mt.textContent=labelFor(h);mt.style.fontSize=big?'1.05rem':'.72rem';mt.style.display=(R.h>46&&R.w>58)?'block':'none';});}

  else if(l==='yield')h='<span>0%</span><span class="gr" style="background:linear-gradient(90deg,#EFEFE9,#FFC800)"></span><span>4%+ · dividend yield</span>';
  else h='<span>Light</span><span class="gr" style="background:linear-gradient(90deg,#EFEFE9,#FF6FA5)"></span><span>Heavy · share of risk vs. share of capital</span>';

var tip=$('#tip');function showTip(h){tip.innerHTML='<b>'+h.t+'</b><span style="opacity:.7">'+h.n+'</span><div><span>Value</span><span>$'+fmt(h.w/100*TOTAL)+'</span></div><div><span>Weight</span><span>'+wAt(h).toFixed(1)+'%</span></div><div><span>Today</span><span>'+pc(h.d,1)+'</span></div><div><span>Return</span><span>'+pc(h.r,1)+'</span></div><div style="color:#FFC800"><span>Click</span><span>open ↗</span></div>';tip.style.display='block';map.classList.add('dim');tiles[h.t].classList.add('hl');}

function openFocus(t){hideTip();S.sel=t;var h=byT(t),c=CC[h.c],ret=h.v-h.cost,i=H.indexOf(h);
  var lots=[['Mar 2023',.45],['Nov 2024',.35],['Jun 2025',.20]].map(function(l){return '<div style="display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1.5px solid var(--ink);font-size:.85rem"><span>'+l[0]+'</span><span class="mo">'+(h.t==='CASH'?'—':(h.qty*l[1]).toFixed(h.qty<5?3:0))+' units</span><span class="mo">$'+fmt(h.cost*l[1])+'</span></div>';}).join('');
  var sp=h.sp,W=400,Hh=110,p=pts(sp,W,Hh);function pts(a,w,hh){var mn=Math.min.apply(null,a),mx=Math.max.apply(null,a);return a.map(function(v,i){return (i*w/(a.length-1)).toFixed(1)+','+(hh-6-(v-mn)/(mx-mn||1)*(hh-12)).toFixed(1);}).join(' ');}
  fo.innerHTML='<div class="top" style="background:'+c[0]+';color:'+c[1]+'"><button class="x" id="fx">✕</button><div class="mo" style="font-size:.72rem;letter-spacing:.1em;opacity:.8">'+h.c.toUpperCase()+' · '+String(i+1).padStart(2,'0')+'/13</div><div class="tkb">'+h.t+'</div><div style="font-weight:700;margin-top:.4rem">'+h.n+'</div></div>'
   +'<div class="stats"><div><small>Value</small><b>$'+fmt(h.w/100*TOTAL)+'</b></div><div><small>Weight</small><b>'+h.w.toFixed(1)+'%</b></div><div><small>Today</small><b style="color:'+(h.d>=0?'var(--gn)':'var(--rd)')+'">'+pc(h.d,2)+'</b></div><div><small>Total return</small><b style="color:'+(h.r>=0?'var(--gn)':'var(--rd)')+'">'+pc(h.r,1)+'</b></div><div><small>Unrealised</small><b>'+(ret>=0?'+':'−')+'$'+fmt(Math.abs(ret))+'</b></div><div><small>Yield</small><b>'+h.y.toFixed(1)+'%</b></div></div>'
   +'<div class="sec"><h5>Last 40 days</h5><svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;display:block"><polyline points="'+p+'" fill="none" stroke="#0B0B0B" stroke-width="3" stroke-linejoin="round"/><circle cx="'+W+'" cy="'+p.split(' ').pop().split(',')[1]+'" r="5" fill="'+c[0]+'" stroke="#0B0B0B" stroke-width="2.5"/></svg></div>'
   +'<div class="sec"><h5>Purchase lots</h5>'+lots+'</div><div class="sec" style="border-bottom:none"><h5>Why it is here</h5><div style="font-size:1.05rem;font-weight:600;line-height:1.35">'+h.note+'</div></div>'
   +'<div class="pn"><button id="fp">← Prev</button><button id="fn">Next →</button></div>';
  fo.classList.add('on');$('#fx').onclick=closeFocus;$('#fp').onclick=function(){openFocus(H[(i+12)%13].t);};$('#fn').onclick=function(){openFocus(H[(i+1)%13].t);};}

   +l.map(function(h,i){return '<tr class="rw" data-t="'+h.t+'"><td><div class="rk">'+String(i+1).padStart(2,'0')+'</div></td><td><div class="tkc">'+h.t+'<small>'+h.n+'</small></div></td><td><span style="display:inline-block;width:14px;height:14px;border:2px solid var(--ink);background:'+CC[h.c][0]+';vertical-align:middle;margin-right:.5rem"></span>'+h.c+'</td><td><div class="wbar"><i style="width:'+(h.w/22*100)+'%"></i></div><span class="mo" style="font-size:.78rem">'+h.w.toFixed(1)+'%</span></td><td class="r mo">$'+fmt(h.v)+'</td><td class="r mo" style="color:'+(h.d>=0?'var(--gn)':'var(--rd)')+';font-weight:500">'+(h.d>=0?'▲ ':'▼ ')+Math.abs(h.d).toFixed(1)+'%</td><td class="r mo" style="color:'+(h.r>=0?'var(--gn)':'var(--rd)')+'">'+pc(h.r,1)+'</td></tr>';}).join('')+'</tbody></table>';
  $$('#p-list th[data-s]').forEach(function(th){th.addEventListener('click',function(){var s=th.dataset.s;if(listS===s)listD*=-1;else{listS=s;listD=(s==='t'||s==='c')?1:-1;}renderList();});});
