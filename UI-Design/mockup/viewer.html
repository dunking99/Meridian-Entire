<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #111; color: #eee; font-family: sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 14px; background: #1b1b1b; border-bottom: 1px solid #2c2c2c; flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { font-size: 12px; color: #888; margin-right: 4px; text-transform: uppercase; letter-spacing: .06em; }
  button, a.btn { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { background: #303030; }
  button.active { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 600; }
  .spacer { flex: 1; }
  main { flex: 1; position: relative; display: flex; justify-content: center; align-items: stretch; overflow: auto; background: #0b0b0b; }
  main.framed { padding: 16px; }
  iframe { border: 0; background: #fff; width: 100%; height: 100%; transition: width .2s ease; }
  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(11,11,11,.85); color: #bbb; }
</style>
</head>
<body>

<header>
  <div class="group">
    <span class="label">Mockup</span>
    <span id="design-buttons" class="group"></span>
  </div>

  <div class="group">
    <span class="label">Size</span>
    <button data-size="100%" class="size active">Desktop</button>
    <button data-size="820px" class="size">Tablet</button>
    <button data-size="390px" class="size">Phone</button>
  </div>

  <span class="spacer"></span>

  <div class="group">
    <button id="prev" title="Previous (left arrow)">&larr;</button>
    <button id="next" title="Next (right arrow)">&rarr;</button>
    <a id="open-tab" class="btn" target="_blank" rel="noopener">Open in new tab &nearr;</a>
  </div>
</header>

<main id="stage">
  <iframe id="frame" title="Mockup preview"></iframe>
  <div id="loading">Loading mockup&hellip;</div>
</main>

<script>
  // ---- Settings you can edit ----------------------------------------
  // Each entry: the HTML file in this folder and the label on its button.
  const MOCKUPS = [
    { file: "analysis-page.html",  name: "Analysis" },
    { file: "colorways.html",      name: "Colorways" },
    { file: "layout-planner.html", name: "Layout Planner" },
    { file: "layout-studio.html",  name: "Layout Studio" },
    { file: "overview-hero.html",  name: "Overview Hero" },
    { file: "tally.html",          name: "Tally" },
    { file: "v1-quarterly.html",   name: "v1 Quarterly" },
    { file: "v2-helm.html",        name: "v2 Helm" },
    { file: "v3-mosaic.html",      name: "v3 Mosaic" },
    { file: "v4-compass.html",     name: "v4 Compass" },
    { file: "v5-thesis.html",      name: "v5 Thesis" },
  ];
  // -------------------------------------------------------------------

  const COUNT = MOCKUPS.length;
  const frame = document.getElementById("frame");
  const stage = document.getElementById("stage");
  const loading = document.getElementById("loading");
  const openTab = document.getElementById("open-tab");
  const buttonWrap = document.getElementById("design-buttons");
  let current = 1;

  MOCKUPS.forEach((m, idx) => {
    const b = document.createElement("button");
    b.textContent = `${idx + 1} · ${m.name}`;
    b.dataset.n = idx + 1;
    b.addEventListener("click", () => select(idx + 1));
    buttonWrap.appendChild(b);
  });

  frame.addEventListener("load", () => { loading.style.display = "none"; });

  function select(n) {
    if (n < 1) n = COUNT;
    if (n > COUNT) n = 1;
    current = n;
    const url = encodeURIComponent(MOCKUPS[n - 1].file);
    loading.style.display = "flex";
    frame.src = url;
    openTab.href = url;
    buttonWrap.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", Number(b.dataset.n) === n)
    );
    try { localStorage.setItem("mockup-viewer-current", n); } catch (e) {}
  }

  document.querySelectorAll("button.size").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("button.size").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      frame.style.width = b.dataset.size;
      stage.classList.toggle("framed", b.dataset.size !== "100%");
    });
  });
  document.getElementById("prev").addEventListener("click", () => select(current - 1));
  document.getElementById("next").addEventListener("click", () => select(current + 1));
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") select(current - 1);
    if (e.key === "ArrowRight") select(current + 1);
  });

  let start = 1;
  try { start = Number(localStorage.getItem("mockup-viewer-current")) || 1; } catch (e) {}
  if (start < 1 || start > COUNT) start = 1;
  select(start);
</script>
</body>
</html>
